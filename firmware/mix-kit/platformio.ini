; spike_esp32_bt_spdif_mix_kit_f32 — the F32 / 24-bit port of spike_esp32_bt_spdif_mix_kit.
;
; Same sources and routing as the int16 mix-kit, but the whole mix bus and the DAC
; output are OpenAudio F32 (float32 in the graph, 32-bit TDM slots to the codec):
;
;   (A) phone --A2DP--> ESP32 --SAI2--> AsyncAudioInput (int16 resampler) -> F32   ---+
;   (B) tone --S/PDIF OUT--[optical loopback]--> AsyncAudioInputSPDIF3_F32 (F32)    ---+
;   (C) SYNTH (Dexed or ymfm OPM, int16 engine) --> AudioConvert_I16toF32           ---+
;   (D) local test tone: AudioSynthWaveformSine_F32                                 ---+
;                                                                                      v
;                        AudioMixer4_F32 (outL/outR) --> AudioOutputTDM_F32 --> TAC5212.
;
; SYNTH BACKEND is a BUILD-TIME choice (src/SynthBackend{Dexed,Ymfm}.h), so the same
; BT + S/PDIF + song-player + app-control firmware ships with either engine:
;   env teensy41        -> -D TDSP_SYNTH_DEXED  (synth_dexed, GPL v3)
;   env teensy41_ymfm  -> -D TDSP_SYNTH_YMFM   (lib/TDspYmfm OPM, BSD-3-Clause)
; The device reports which engine it was built with to the app (sendCatalog).
;
; ESP32 control (via lib/TDspProgrammingKit): r=reset->app  g=flash mode  @BOOTAPP@=exit
;   U=Teensy program mode.  Needs the pin37->ESP32-EN jumper (see the kit README).
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind a
; TCA9544A I2C mux).
[common]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    ; F32 / 48 kHz graph -- matches the proven F32 path. AudioOutputTDM_F32 masters
    ; SAI1 at this rate; the async resamplers retime the 44.1k A2DP / optical streams.
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    ; Size the resampler filter array (halfFilterLength(20)*overSampling(1024)+1).
    -D MAX_FILTER_SAMPLES=20481
    ; USB = Serial + MTP: the microSD appears on the host so songs can be dropped
    ; into /songs. Serial kept for debug + the ESP32 flash bridge.
    -D USB_MTPDISK_SERIAL
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
; NOTE: OpenAudio_ArduinoLibrary is NOT ignored -- the F32 mix bus, converts, and
; AudioOutputTDM_F32 all come from it.

; --- default: Dexed backend (synth_dexed, GPL v3) ---------------------------
; Linking synth_dexed makes the flashed binary GPL v3; repo-side MIT source
; unaffected. Fetched into the gitignored .pio/libdeps at build time.
[env:teensy41]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_DEXED=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed + OPLL PARALLEL DRUM VOICE (-D TDSP_DRUM_VOICE) -------------------
; Plain Dexed (melodic, non-GM) PLUS the small OPLL rhythm drum voice (src/DrumVoice.h)
; on the free mix slot 2. NO PSRAM — the no-PSRAM alternative to the TSF drum voice
; (teensy41_dexed_pool_drums). 5 rhythm sounds vs TSF's full sampled kit. Mutually
; exclusive with TDSP_DRUM_TSF. pio run -e teensy41_dexed_drumvoice
[env:teensy41_dexed_drumvoice]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_DEXED=1
    -D TDSP_DRUM_VOICE=1
    -D TDSP_NO_SPDIF_IN=1   ; free mix slot 2 for the drum voice
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed MPE pool (synth_dexed, GPL v3) -----------------------------------
; Same Dexed FM engine, but a POOL of engines (one per note in MPE mode) so
; per-note pitch bend / pressure work — real MPE from a monotimbral engine, and
; NO PSRAM needed (unlike the TSF/SF2 MPE path). Normal MIDI packs the pool for
; polyphony. See src/SynthBackendDexedPool.h + DexedPoolSink.h.
[env:teensy41_dexed_pool]
extends = common
build_flags = ${common.build_flags}
    ; Board profile: makes this unit's capabilities/roles/defaults explicit in one
    ; reviewable header (see include/boards/). Behaviour-identical to the defaults.
    -D TDSP_BOARD_HEADER=\"boards/digital_audio_board.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    ; 8 Dexed engines fill RAM1 (DTCM). Drop optical S/PDIF IN (its async
    ; resampler filter[] costs ~87 KB DTCM) to give the pool + stack headroom.
    ; Optical OUT self-test tone and Bluetooth IN are unaffected.
    -D TDSP_NO_SPDIF_IN=1
    ; No-PSRAM pool is OCRAM-starved: stub the ~128 KB of @CAP/@PROOF/ADC capture
    ; buffers (tuning-only) so the malloc heap has room to load SD-card .mid songs.
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed pool on the NO-ESP32 board (demonstrates board-profile -> role -> RAM) --
; Same Dexed MPE pool, but the board profile is the ESP32-not-populated variant
; (boards/digital_audio_board_nobt.h). That header sets TDSP_HAS_ESP32_BT 0, so
; TDSP_ROLE_BT_RECEIVER defaults to 0 and main.cpp graph-gates the whole A2DP path
; out -- freeing ~103 KB of DTCM vs teensy41_dexed_pool. Extends common (not the pool
; env) so exactly one TDSP_BOARD_HEADER is defined.  pio run -e teensy41_dexed_pool_nobt
[env:teensy41_dexed_pool_nobt]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/digital_audio_board_nobt.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- jay-mint board: LINE OUT (boards/jaymint.h) ----------------------------
; The jay-mint unit (SN 7681380) wired for line out instead of headphone. Same
; Dexed MPE pool; the board profile flips TDSP_OUT_TYPE -> LINE (TAC5212 SeLine)
; and sets line-out startup levels. Synth-engine choice for this unit is separate
; (see tools/boards.tsv note -- the pool env has hung on this board before).
[env:teensy41_dexed_pool_jaymint]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed pool + dedicated GM-drum TSF (PSRAM board) -----------------------
; The Dexed pool is melodic-only, so drum grooves are normally gated off. This build
; adds a SECOND, drum-only TinySoundFont (lib/TDspTsf) on the free mix slot 2 (S/PDIF-in
; is already dropped here), fed by the groove player, so a GM drum beat loops UNDER the
; live DX7 voice. The resident drum font needs PSRAM -> flash this on a PSRAM board
; (jay-mint SN 7681380). Font path defaults to /sf2/gm_tsf.sf2 (see DrumTsf.h).
[env:teensy41_dexed_pool_drums]
extends = env:teensy41_dexed_pool
build_flags = ${env:teensy41_dexed_pool.build_flags}
    -D TDSP_DRUM_TSF=1
; lib_deps inherited from the parent; lib/TDspTsf is auto-found by LDF from DrumTsf.h's
; #include <AudioSynthTsf.h> (TDSP_DRUM_TSF is set, so the chain LDF sees the include).

; --- jay-mint: Dexed pool + TSF drums, LINE OUT, stack-safe -----------------
; The jay-mint config of the above (Dexed MPE pool + resident drum-only TSF): pins
; boards/jaymint.h (LINE OUT) and shrinks the BT async-resampler filter[] so RAM1 has a
; safe stack margin. The stock teensy41_dexed_pool_drums leaves only ~15 KB stack here
; (the Dexed pool + a full TSF drum font is DTCM-heavy) which risks an ISR-chain overflow
; once the A2DP graph goes live -- exactly the crash-loop this board hit before. Dropping
; MAX_FILTER_SAMPLES 20481->5121 (BT resampler oversampling 1024->256, modest quality) frees
; ~90 KB DTCM -> ~100 KB stack. Needs /sf2/gm_tsf.sf2 on the SD.  pio run -e teensy41_dexed_pool_drums_jaymint
[env:teensy41_dexed_pool_drums_jaymint]
extends = env:teensy41_dexed_pool_jaymint
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D TDSP_DRUM_TSF=1
    ; Reclaim ~90 KB DTCM for stack headroom (overrides common's 20481 -> the later -D wins;
    ; GCC emits a harmless "redefined" note). BT resampler oversampling 1024 -> 256.
    -D MAX_FILTER_SAMPLES=5121

; --- Dexed pool + OPLL DRUM VOICE (no-PSRAM alternative to _drums) -----------
; The Dexed MPE pool + the OPLL rhythm drum voice (src/DrumVoice.h) on slot 2 — the
; no-PSRAM sibling of teensy41_dexed_pool_drums (which uses a resident TSF font). The
; parent pool env already sets TDSP_NO_SPDIF_IN. pio run -e teensy41_dexed_pool_drumvoice
[env:teensy41_dexed_pool_drumvoice]
extends = env:teensy41_dexed_pool
build_flags = ${env:teensy41_dexed_pool.build_flags}
    -D TDSP_DRUM_VOICE=1
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- Dexed pool + OPLL drum voice on the NO-ESP32 (Bluetooth-free) board ------
; Same as teensy41_dexed_pool_drumvoice, but the board profile is the ESP32-not-
; populated SKU (boards/digital_audio_board_nobt.h): TDSP_HAS_ESP32_BT 0 graph-gates
; the A2DP path out (~103 KB DTCM reclaimed) and the catalog reports "bt":false so the
; app hides its Bluetooth card. This is the local dev board's build (SN 18402920, COM4,
; no ESP32).  pio run -e teensy41_dexed_pool_nobt_drumvoice
[env:teensy41_dexed_pool_nobt_drumvoice]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_DRUM_VOICE=1
    ; Metronome click on the local dev board (drum voice owns slot 2; the metronome
    ; reuses the test-tone oscillator on slot 1, so no contention). PLAN §13.
    -D TDSP_METRONOME=1
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- Local dev board: dexed pool + OPLL drums + VOICES 2 (split keyboard) + ARP 2 --
; teensy41_dexed_pool_nobt_drumvoice PLUS the build-flag-gated second synth voice: the pool
; splits 4/4 (engines 0..3 = song/arp/drums on voice 1, engines 4..7 = a USB-host keyboard
; on voice 2) when the app enables it (@VOICE2=1). TDSP_ARP2 adds an independent arp on the
; keyboard path. Both features are pool-only; the app hides the cards on builds without them
; (see @STATE "caps"). See planning/synth-voices-2/PLAN.md.  pio run -e teensy41_dexed_pool_nobt_voice2
[env:teensy41_dexed_pool_nobt_voice2]
extends = env:teensy41_dexed_pool_nobt_drumvoice
build_flags = ${env:teensy41_dexed_pool_nobt_drumvoice.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1

; --- jay-mint (Linux host): dexed pool + OPLL drum voice, LINE OUT, USB_SERIAL ---
; The jay-mint config of teensy41_dexed_pool_drumvoice: dexed MPE pool + the OPLL rhythm
; drum voice (src/DrumVoice.h) on slot 2, pinned to boards/jaymint.h (LINE OUT) and built
; plain USB_SERIAL so the Linux flash host's serial TX works (@WB/@STATE/@CRC round-trip;
; the MTP composite's DTR handshake is dead on Linux — see teensy41_sf2_tsf_jaymint_serial).
; jaymint.h keeps ESP32 BT on, so RAM1 is tighter than the nobt build — if the stack margin
; is unsafe, add -D MAX_FILTER_SAMPLES=5121 (frees ~90 KB DTCM, modest BT-resampler quality).
;   pio run -e teensy41_dexed_pool_jaymint_drumvoice_serial
[env:teensy41_dexed_pool_jaymint_drumvoice_serial]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_MTPDISK_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D TDSP_DRUM_VOICE=1
    -D USB_SERIAL
    -D TDSP_METRONOME=1   ; on-beat click (reuses test-tone slot 1); @METRO=0|1. PLAN §13
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- jay-mint (Linux host): dexed pool + OPLL drums + VOICES 2 + ARP 2, USB_SERIAL --
; The jay-mint config of teensy41_dexed_pool_nobt_voice2: the jaymint board profile (LINE
; OUT, ESP32/BT on) + USB_SERIAL for the Linux flash host, PLUS the Voices-2 split + arp-2.
; NOTE: the jay-mint board has hung/re-enumerated on Dexed-pool builds before (power
; contention); if unstable, that's the board, not this feature. pio run -e teensy41_dexed_pool_jaymint_voice2_serial
[env:teensy41_dexed_pool_jaymint_voice2_serial]
extends = env:teensy41_dexed_pool_jaymint_drumvoice_serial
build_flags = ${env:teensy41_dexed_pool_jaymint_drumvoice_serial.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1

; --- ymfm OPM backend (lib/TDspYmfm, BSD-3-Clause) --------------------------
; Same BT + S/PDIF + songs + app control, but the synth is the YM2151 emulation.
; lib_deps override drops synth_dexed (no GPL in this build); build_src_filter
; excludes DexedVoiceBank.cpp (Dexed-only; pulls synth_dexed.h).
[env:teensy41_ymfm]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_YMFM=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Plaits (Mutable Instruments macro-oscillator) — authentic, MIT ----------
; The real Plaits DSP (lib/TDspPlaits2: plaits/ + stmlib subset, Emilie Gillet,
; MIT), a 4-voice MPE pool over the 16 synthesis models. Renders native 48 kHz.
; Proven first on projects/spike_midi_plaits. Mix-kit side is SynthBackendPlaits.h.
;   pio run -e teensy41_plaits
[env:teensy41_plaits]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_PLAITS=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>
; plaits_flashmem.py relocates libTDspPlaits2.a code to FLASH (out of ITCM) so
; the 16-engine Plaits fits alongside the BT + S/PDIF resamplers in RAM1.
extra_scripts =
    ../../tools/cores_overlay.py
    ./plaits_flashmem.py

; --- Rings (DaisySP modal/string resonator) — MIT ---------------------------
; Mutable-Rings-style physical-modelling resonator (DaisySP ModalVoice +
; StringVoice, lib/TDspRings). 2 voices (the 24-mode modal resonator is ~32%
; CPU/voice; idle-gated). Proven first on projects/spike_midi_rings. Mix-kit
; side is SynthBackendRings.h.  pio run -e teensy41_rings
[env:teensy41_rings]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_RINGS=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Virtual Analog (DaisySP: osc -> ladder -> ADSR) — MIT -------------------
; Subtractive VA synth, 8-voice, 5 presets, full 3-axis MPE. Built from DaisySP
; band-limited oscillators + Moog ladder filter (NOT ElectroTechnique's GPL
; TSynth). lib/TDspDaisyVa. Proven first on projects/spike_midi_va.
;   pio run -e teensy41_va
[env:teensy41_va]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_VA=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPL3 (YMF262) + DMXOPL General-MIDI backend (BSD/CC-BY-SA) --------------
; The right engine for GM MIDI songs: 18-channel multitimbral + a full GM bank
; with drums. PENDING the OPL3 engine in lib/TDspYmfm — see
; lib/TDspYmfm/OPL3_DMXOPL_SPEC.md. The mix-kit side (SynthBackendOpl3.h /
; Opl3Sink.h / main.cpp branch) is already wired; UNCOMMENT this env once
; AudioSynthYmfmOPL3 exists, then `pio run -e teensy41_opl3`.
[env:teensy41_opl3]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPL3=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPLL (YM2413) — the PSS-140 chip (BSD, ymfm) ---------------------------
; Yamaha YM2413 OPLL: 9-channel 2-op FM, 15 built-in ROM instruments + a 5-piece
; rhythm section. The literal chip in the Yamaha PSS-140. Self-contained GM: songs
; map per-channel program -> one of 15 timbres, drums on ch10. Engine lives in
; lib/TDspYmfm (AudioSynthYmfmOPLL); mix-kit side is SynthBackendOpll.h/OpllSink.h.
;   pio run -e teensy41_opll
[env:teensy41_opll]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL=1
    ; Drop optical S/PDIF IN (its async resampler filter[] costs ~87 KB DTCM). The
    ; `common` base leaves it on, which pushes even the tiny OPLL engine ~30 KB over
    ; RAM1; without it OPLL fits with ample headroom. Optical OUT self-test tone and
    ; Bluetooth A2DP IN are unaffected. This makes OPLL the "fits anywhere" GM test env.
    -D TDSP_NO_SPDIF_IN=1
    ; Metronome click (reuses the test-tone oscillator, mix slot 1; @METRO=0|1). See
    ; planning/tick-sync-playback/PLAN.md §13. Opt-in per env; slot-free so cheap here.
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPLL chip POOL — full 3-axis MPE (BSD, ymfm) ---------------------------
; A pool of N YM2413 chips (one note each) so the OPLL can do TRUE per-note MPE:
; bend + pressure + timbre (CC#74 -> per-note modulator brightness), the axis a
; single shared-user-voice chip can't do. 15 ROM + 100 PSS-140 voices, all loaded
; as modulatable user voices. Engine: lib/TDspYmfm/AudioSynthYmfmOPLLPool; mix-kit
; side: SynthBackendOpllPool.h / OpllPoolSink.h.  pio run -e teensy41_opll_pool
[env:teensy41_opll_pool]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL_POOL=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- SF2 sampled General-MIDI backend (lib/TDspSF2 + sf22aswt, MIT) ----------
; Real sampled instruments (a "quality keyboard", not FM): a pool of
; AudioSynthWavetable voices driven by lib/TDspSF2's GM engine, loading SF2
; instruments off SD into PSRAM at runtime (adaptive to 8/16 MB). No GPL.
; Needs /sf2/gm.sf2 on the card. build_src_filter drops DexedVoiceBank.cpp
; (Dexed-only; pulls synth_dexed.h).
[env:teensy41_sf2]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_SF2=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Full-fidelity SF2 GM via TinySoundFont (lib/TDspTsf, MIT) ---------------
; A COMPLETE SF2 renderer (velocity layers, region layering, all generators,
; filters, GM drums) — the full-featured alternative to teensy41_sf2's
; sf22aswt/AudioSynthWavetable engine. Whole font resident in PSRAM (samples as
; float), so it needs a COMPACT font at /sf2/gm_tsf.sf2 (GeneralUser's 30 MB
; won't fit). No GPL. Drops DexedVoiceBank.cpp (Dexed-only).
[env:teensy41_sf2_tsf]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_SF2_TSF=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- jay-mint board: full-fidelity TSF GM (+ its own GM drums), LINE OUT ------
; The defined config for the jay-mint board (Teensy SN 7681380, 8 MB PSRAM): the
; TinySoundFont GM engine — which renders channel-10 drums itself, so this IS
; "TSF + TSF drums" — pinned to the jay-mint board profile (boards/jaymint.h:
; LINE OUT + unity startup). Needs /sf2/gm_tsf.sf2 on the SD card (TimGM6mb, from
; tools/sf2/fonts/gm_tim.sf2).  pio run -e teensy41_sf2_tsf_jaymint
[env:teensy41_sf2_tsf_jaymint]
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    ; The whole-font-resident TSF engine + BT resampler overflow RAM1 (DTCM) by ~22 KB
    ; if optical S/PDIF-in is also linked (its async resampler filter[] ~87 KB DTCM).
    ; Drop S/PDIF-in to reclaim it; optical OUT self-test + Bluetooth IN are unaffected.
    -D TDSP_NO_SPDIF_IN=1
build_src_filter = ${env:teensy41_sf2_tsf.build_src_filter}

; --- jay-mint LINUX flash host: same TSF GM firmware but plain USB_SERIAL -----
; The Serial+MTP composite (USB_MTPDISK_SERIAL) is unusable when jay-mint.local
; (Linux) is the USB host: cdc_acm can't set dtr/rts on the composite, so the
; Teensy's DTR-gated Serial never asserts and TRANSMITS 0 bytes -- which breaks
; @WB acks (@WOK/@WE), the @CRC round-trip, and the esptool ESP32 bridge. This
; env drops MTP and builds plain USB_SERIAL (device enumerates 16c0:0483
; "Teensyduino Serial", DTR works). No host drag-and-drop to the SD, but @WB
; writes the card directly so that's irrelevant for a flash host. The 5 MTP call
; sites in main.cpp are #ifdef USB_MTPDISK_SERIAL so this compiles clean.
;   pio run -e teensy41_sf2_tsf_jaymint_serial
[env:teensy41_sf2_tsf_jaymint_serial]
extends = env:teensy41_sf2_tsf_jaymint
build_unflags = ${common.build_unflags}
    -D USB_MTPDISK_SERIAL
build_flags = ${env:teensy41_sf2_tsf_jaymint.build_flags}
    -D USB_SERIAL
build_src_filter = ${env:teensy41_sf2_tsf_jaymint.build_src_filter}

; --- TSF font variants (A/B different SoundFonts) ----------------------------
; Same engine as teensy41_sf2_tsf; each picks a different RESIDENT font via a build
; flag (SynthBackendSF2Tsf.h). Copy the matching file from tools/sf2/fonts/ to the SD
; card at the path the flag names, then `pio run -e <env> -t upload`. The full
; size / PSRAM / quality matrix lives in tools/sf2/FONTS.md. No-flag base env above =
; TimGM6mb (/sf2/gm_tsf.sf2), the 8 MB-safe default.
[env:teensy41_sf2_tsf_gu12]        ; GeneralUser 12kHz  ~11.7MB  -> 16MB SAFE
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU12=1
[env:teensy41_sf2_tsf_gu14]        ; GeneralUser 14kHz  ~13.5MB  -> 16MB push
