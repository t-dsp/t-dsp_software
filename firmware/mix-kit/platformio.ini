; spike_esp32_bt_spdif_mix_kit_f32 — the F32 / 24-bit port of spike_esp32_bt_spdif_mix_kit.
;
; Same sources and routing as the int16 mix-kit, but the whole mix bus and the DAC
; output are OpenAudio F32 (float32 in the graph, 32-bit TDM slots to the codec):
;
;   (A) phone --A2DP--> ESP32 --SAI2--> AsyncAudioInput (int16 resampler) -> F32   ---+
;   (B) tone --S/PDIF OUT--[optical loopback]--> AsyncAudioInputSPDIF3_F32 (F32)    ---+
;   (C) SYNTH (Dexed or ymfm OPM, int16 engine) --> AudioConvert_I16toF32           ---+
;   (D) local test tone: AudioSynthWaveformSine_F32                                 ---+
;                                                                                      v
;                        AudioMixer4_F32 (outL/outR) --> AudioOutputTDM_F32 --> TAC5212.
;
; SYNTH BACKEND is a BUILD-TIME choice (src/SynthBackend{Dexed,Ymfm}.h), so the same
; BT + S/PDIF + song-player + app-control firmware ships with either engine:
;   env teensy41        -> -D TDSP_SYNTH_DEXED  (synth_dexed, GPL v3)
;   env teensy41_ymfm  -> -D TDSP_SYNTH_YMFM   (lib/TDspYmfm OPM, BSD-3-Clause)
; The device reports which engine it was built with to the app (sendCatalog).
;
; ESP32 control (via lib/TDspProgrammingKit): r=reset->app  g=flash mode  @BOOTAPP@=exit
;   U=Teensy program mode.  Needs the pin37->ESP32-EN jumper (see the kit README).
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind a
; TCA9544A I2C mux).
[common]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    ; Bake the PlatformIO env name into the firmware so @STATE can report which board file is
    ; flashed (the app's Settings page shows it). ${PIOENV} resolves per-env at build time.
    -D TDSP_ENV=\"${PIOENV}\"
    ; F32 / 48 kHz graph -- matches the proven F32 path. AudioOutputTDM_F32 masters
    ; SAI1 at this rate; the async resamplers retime the 44.1k A2DP / optical streams.
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    ; Size the resampler filter array (halfFilterLength(20)*overSampling(1024)+1).
    -D MAX_FILTER_SAMPLES=20481
    ; USB = Serial + MTP: the microSD appears on the host so songs can be dropped
    ; into /songs. Serial kept for debug + the ESP32 flash bridge.
    -D USB_DUAL_SERIAL
build_unflags = -std=gnu++14
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py   ; lift synth_dexed's +-12 pitch-bend cap to +-24 (no-op for non-Dexed envs)
    post:../../tools/fx_ld_compat.py  ; strip --no-warn-rwx-segments for binutils<2.39 (jay-mint ld 2.38); benign
lib_extra_dirs = ../../lib
; chain+ so the LDF EVALUATES build-flag #if conditionals when following includes. Without the
; '+', plain `chain` scans includes inside inactive `#if` blocks too, so e.g. lib/USB_Audio_F32_24
; (gated behind `#if TDSP_USB_AUDIO` in main.cpp) gets compiled into non-USB-audio envs and fails
; to link (AudioOutputUSB undeclared). '+' skips libs whose only include site is a disabled branch.
lib_ldf_mode = chain+
; NOTE: OpenAudio_ArduinoLibrary is NOT ignored -- the F32 mix bus, converts, and
; AudioOutputTDM_F32 all come from it.

; --- default: Dexed backend (synth_dexed, GPL v3) ---------------------------
; Linking synth_dexed makes the flashed binary GPL v3; repo-side MIT source
; unaffected. Fetched into the gitignored .pio/libdeps at build time.
[env:teensy41]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_DEXED=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed + OPLL PARALLEL DRUM VOICE (-D TDSP_DRUM_VOICE) -------------------
; Plain Dexed (melodic, non-GM) PLUS the small OPLL rhythm drum voice (src/DrumVoice.h)
; on the free mix slot 2. NO PSRAM — the no-PSRAM alternative to the TSF drum voice
; (teensy41_dexed_pool_drums). 5 rhythm sounds vs TSF's full sampled kit. Mutually
; exclusive with TDSP_DRUM_TSF. pio run -e teensy41_dexed_drumvoice
[env:teensy41_dexed_drumvoice]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_DEXED=1
    -D TDSP_DRUM_VOICE=1
    -D TDSP_NO_SPDIF_IN=1   ; free mix slot 2 for the drum voice
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed MPE pool (synth_dexed, GPL v3) -----------------------------------
; Same Dexed FM engine, but a POOL of engines (one per note in MPE mode) so
; per-note pitch bend / pressure work — real MPE from a monotimbral engine, and
; NO PSRAM needed (unlike the TSF/SF2 MPE path). Normal MIDI packs the pool for
; polyphony. See src/SynthBackendDexedPool.h + DexedPoolSink.h.
[env:teensy41_dexed_pool]
extends = common
build_flags = ${common.build_flags}
    ; Board profile: makes this unit's capabilities/roles/defaults explicit in one
    ; reviewable header (see include/boards/). Behaviour-identical to the defaults.
    -D TDSP_BOARD_HEADER=\"boards/digital_audio_board.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    ; 8 Dexed engines fill RAM1 (DTCM). Drop optical S/PDIF IN (its async
    ; resampler filter[] costs ~87 KB DTCM) to give the pool + stack headroom.
    ; Optical OUT self-test tone and Bluetooth IN are unaffected.
    -D TDSP_NO_SPDIF_IN=1
    ; No-PSRAM pool is OCRAM-starved: stub the ~128 KB of @CAP/@PROOF/ADC capture
    ; buffers (tuning-only) so the malloc heap has room to load SD-card .mid songs.
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed pool on the NO-ESP32 board (demonstrates board-profile -> role -> RAM) --
; Same Dexed MPE pool, but the board profile is the ESP32-not-populated variant
; (boards/digital_audio_board_nobt.h). That header sets TDSP_HAS_ESP32_BT 0, so
; TDSP_ROLE_BT_RECEIVER defaults to 0 and main.cpp graph-gates the whole A2DP path
; out -- freeing ~103 KB of DTCM vs teensy41_dexed_pool. Extends common (not the pool
; env) so exactly one TDSP_BOARD_HEADER is defined.  pio run -e teensy41_dexed_pool_nobt
[env:teensy41_dexed_pool_nobt]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/digital_audio_board_nobt.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- jay-mint board: LINE OUT (boards/jaymint.h) ----------------------------
; The jay-mint unit (SN 7681380) wired for line out instead of headphone. Same
; Dexed MPE pool; the board profile flips TDSP_OUT_TYPE -> LINE (TAC5212 SeLine)
; and sets line-out startup levels. Synth-engine choice for this unit is separate
; (see tools/boards.tsv note -- the pool env has hung on this board before).
[env:teensy41_dexed_pool_jaymint]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    -D TDSP_SYNTH_DEXED_POOL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_LEAN_RAM=1
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- Dexed pool + dedicated GM-drum TSF (PSRAM board) -----------------------
; The Dexed pool is melodic-only, so drum grooves are normally gated off. This build
; adds a SECOND, drum-only TinySoundFont (lib/TDspTsf) on the free mix slot 2 (S/PDIF-in
; is already dropped here), fed by the groove player, so a GM drum beat loops UNDER the
; live DX7 voice. The resident drum font needs PSRAM -> flash this on a PSRAM board
; (jay-mint SN 7681380). Font path defaults to /sf2/gm_tsf.sf2 (see DrumTsf.h).
[env:teensy41_dexed_pool_drums]
extends = env:teensy41_dexed_pool
build_flags = ${env:teensy41_dexed_pool.build_flags}
    -D TDSP_DRUM_TSF=1
; lib_deps inherited from the parent; lib/TDspTsf is auto-found by LDF from DrumTsf.h's
; #include <AudioSynthTsf.h> (TDSP_DRUM_TSF is set, so the chain LDF sees the include).

; --- jay-mint: Dexed pool + TSF drums, LINE OUT, stack-safe -----------------
; The jay-mint config of the above (Dexed MPE pool + resident drum-only TSF): pins
; boards/jaymint.h (LINE OUT) and shrinks the BT async-resampler filter[] so RAM1 has a
; safe stack margin. The stock teensy41_dexed_pool_drums leaves only ~15 KB stack here
; (the Dexed pool + a full TSF drum font is DTCM-heavy) which risks an ISR-chain overflow
; once the A2DP graph goes live -- exactly the crash-loop this board hit before. Dropping
; MAX_FILTER_SAMPLES 20481->5121 (BT resampler oversampling 1024->256, modest quality) frees
; ~90 KB DTCM -> ~100 KB stack. Needs /sf2/gm_tsf.sf2 on the SD.  pio run -e teensy41_dexed_pool_drums_jaymint
[env:teensy41_dexed_pool_drums_jaymint]
extends = env:teensy41_dexed_pool_jaymint
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D TDSP_DRUM_TSF=1
    ; Reclaim ~90 KB DTCM for stack headroom (overrides common's 20481 -> the later -D wins;
    ; GCC emits a harmless "redefined" note). BT resampler oversampling 1024 -> 256.
    -D MAX_FILTER_SAMPLES=5121

; --- Dexed pool + OPLL DRUM VOICE (no-PSRAM alternative to _drums) -----------
; The Dexed MPE pool + the OPLL rhythm drum voice (src/DrumVoice.h) on slot 2 — the
; no-PSRAM sibling of teensy41_dexed_pool_drums (which uses a resident TSF font). The
; parent pool env already sets TDSP_NO_SPDIF_IN. pio run -e teensy41_dexed_pool_drumvoice
[env:teensy41_dexed_pool_drumvoice]
extends = env:teensy41_dexed_pool
build_flags = ${env:teensy41_dexed_pool.build_flags}
    -D TDSP_DRUM_VOICE=1
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- Dexed pool + OPLL drum voice on the NO-ESP32 (Bluetooth-free) board ------
; Same as teensy41_dexed_pool_drumvoice, but the board profile is the ESP32-not-
; populated SKU (boards/digital_audio_board_nobt.h): TDSP_HAS_ESP32_BT 0 graph-gates
; the A2DP path out (~103 KB DTCM reclaimed) and the catalog reports "bt":false so the
; app hides its Bluetooth card. This is the local dev board's build (SN 18402920, COM4,
; no ESP32).  pio run -e teensy41_dexed_pool_nobt_drumvoice
[env:teensy41_dexed_pool_nobt_drumvoice]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_DRUM_VOICE=1
    ; Metronome click on the local dev board (drum voice owns slot 2; the metronome
    ; reuses the test-tone oscillator on slot 1, so no contention). PLAN §13.
    -D TDSP_METRONOME=1
    ; Beat-aware MIDI loop recorder (lib/TDspMidiLoop). Single-voice here (no TDSP_VOICE2),
    ; so only g_loop1 exists: it taps track 0's (the Dexed pool's) BAKED arp output into
    ; 1/2/4/8-bar loops locked to the master downbeat. Exposes @REC*/@STATE "rec" + caps.rec,
    ; which un-hides the app's "Loop Recorder" card. See project_midi_loop_recorder.
    -D TDSP_RECORDER=1
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- Dexed pool + AUTHENTIC PLAITS drum kit (DrumPlaits.h) — no PSRAM ------------------------------
; Same as teensy41_dexed_pool_nobt_drumvoice but the ch10 drums are the real Mutable Plaits drum models
; (Bass Drum / Snare / Hi-Hat, engines 13/14/15) instead of the OPLL rhythm voice — a 3-voice pool,
; each reconfigured live to the GM note's model/pitch/decay (DrumPlaits.h, ported from spike_plaits_drums).
; The Dexed pool is the melodic primary (non-GM, so ch10 routes to the drum pool). Plaits engine code is
; relocated to FLASH (plaits_flashmem.ld) so the Dexed pool + 3 Plaits voices fit RAM1.  pio run -e teensy41_dexed_pool_nobt_plaitsdrums
[env:teensy41_dexed_pool_nobt_plaitsdrums]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_DRUM_PLAITS=1        ; ch10 drums = authentic Plaits drum models (13/14/15)
    -D TDSP_DRUM_PLAITS_VOICES=3 ; kick+snare+hat overlap (3 voices ~48 KB OCRAM)
    -D TDSP_DRUM_SLOT=2          ; Plaits drums -> mix slot 2 (S/PDIF-in dropped frees it)
    -D TDSP_METRONOME=1          ; metronome reuses the test-tone osc on slot 1 (no contention)
    -D TDSP_NO_SPDIF_IN=1        ; free DTCM (Plaits code) + free the drum mix slot
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py
    ./plaits_flashmem.py

; --- Local dev board: dexed pool + OPLL drums + VOICES 2 (split keyboard) + ARP 2 --
; teensy41_dexed_pool_nobt_drumvoice PLUS the build-flag-gated second synth voice: the pool
; splits 4/4 (engines 0..3 = song/arp/drums on voice 1, engines 4..7 = a USB-host keyboard
; on voice 2) when the app enables it (@VOICE2=1). TDSP_ARP2 adds an independent arp on the
; keyboard path. Both features are pool-only; the app hides the cards on builds without them
; (see @STATE "caps"). See planning/synth-voices-2/PLAN.md.  pio run -e teensy41_dexed_pool_nobt_voice2
[env:teensy41_dexed_pool_nobt_voice2]
extends = env:teensy41_dexed_pool_nobt_drumvoice
build_flags = ${env:teensy41_dexed_pool_nobt_drumvoice.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    ; Beat-aware MIDI loop recorder for both voices (lib/TDspMidiLoop). Records the
    ; active keyboard's baked arp output into 1/2/4/8-bar loops locked to the master
    ; downbeat; @REC*/@STATE "rec". See project_midi_loop_recorder.
    -D TDSP_RECORDER=1
    ; Audio loop recorder (lib/TDspAudioLoop): master mix -> bar-locked crossfaded audio
    ; loops; @AL*/@STATE "aloop". NOTE this board has NO PSRAM and runs TDSP_LEAN_RAM
    ; (OCRAM reserved for the SD-song heap), so buffers may not allocate -> caps.audioloop=0
    ; and the card hides. Needs PSRAM (jay-mint) for real capacity. See planning/audio-looper/.
    -D TDSP_AUDIOLOOP=1

; --- Local dev board: FOUR independent Dexed voices (Phase 3, Thread A) -----------
; The 8-engine Dexed pool as a FIXED 4-way split: four independent 2-engine voices (2-note
; MPE / 4-note poly each), each with its own song player, arp, live-MIDI router+subscription,
; mix bus, level, and ReplayGain trim. No runtime @VOICE2 toggle — all four are always live;
; a MIDI-source switch (@TRK<i>.SRC) never repatches audio. Based on the OPLL-drum pool build
; (drums as a Track) + VOICE2/ARP2 (voices 0/1 machinery) + SYNTH_VOICES=4 (voices 2/3). No
; MIDI/audio-loop recorder here — the two extra song buffers (g_buf3/g_buf4) need the OCRAM.
; USER audio-tests balance / MPE / no-clip before merge.  pio run -e teensy41_dexed_pool_4voice
[env:teensy41_dexed_pool_4voice]
extends = env:teensy41_dexed_pool_nobt_drumvoice
build_flags = ${env:teensy41_dexed_pool_nobt_drumvoice.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_SYNTH_VOICES=4
    ; Two extra voices' control objects (player+arp+router+sink) grow DTCM; drop the diagnostics
    ; suite (@MPESWEEP/@PROOF/@GAIN sweep + the clip-probe click detector) to stay in RAM1 budget.
    ; The 4-voice audio path itself is unaffected; ReplayGain tables ship at unity here.
    -D TDSP_DIAGNOSTICS=0

; --- Local dev board: FOUR uniform Dexed pool voices (A/B/C/D) + OPLL drums + spring reverb + the
;     per-voice MIDI looper, MPE-on-boot. The "componentized synth" target: every synth voice is the
;     SAME Dexed pool window, so the app renders N identical Synth cards (Synth/Voices + MIDI Player +
;     MIDI Looper + Arpeggiator) and each records/plays independently. No hetero engines -> nothing
;     single-voice to get cut when a loop panics (that OPLL bug is designed out). Scales to whatever
;     the pool/RAM allows.  pio run -e teensy41_dexed_pool_4voice_fx_loop
[env:teensy41_dexed_pool_4voice_fx_loop]
extends = env:teensy41_dexed_pool_4voice
build_flags = ${env:teensy41_dexed_pool_4voice.build_flags}
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1          ; spring reverb (OCRAM-light) as a MASTER INSERT (no per-voice send:
                                 ; TDSP_FX_SEND's tap matrix is wired for the 2-Dexed+OPLL layout, not
                                 ; the 4-voice pool — a global reverb is what this all-Dexed build wants)
    -D TDSP_DEFAULT_MPE=1        ; boot into MPE (bend range = default 24)

; --- Local dev board: HETEROGENEOUS inventory — 2 Dexed + 1 melodic OPLL (Phase 4, Thread D) ---
; The engine-inventory payoff: the pool splits 4/4 into TWO independent Dexed voices (tracks 0/1,
; g_synthSink / g_synthSinkB) AND a THIRD track is a melodic OPLL (YM2413) engine on the free mix
; slot 0 (nobt board -> no BT there). Proves "N synths of DIFFERENT kinds" + per-track engine
; binding: @TRK0/@TRK1 drive Dexed, @TRK2 drives OPLL, all through the same uniform Track stack
; (player/arp/router/live-MIDI subscription). New count flags (TDSP_HETERO/DEXED_VOICES/OPLL_ENGINES)
; gate ALL of this so every non-hetero build is byte-identical. OPLL is FM (CPU-bound, RAM-cheap ~9KB,
; no PSRAM) so this fits a no-PSRAM board. Diagnostics off for DTCM headroom (matches _4voice).
; See planning/tracks/PHASE4_HANDOFF.md §4 + HeteroOpll.h.  pio run -e teensy41_dexed2_opll1
[env:teensy41_dexed2_opll1]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=2
    -D TDSP_OPLL_ENGINES=1
    -D TDSP_SYNTH_VOICES=3   ; 2 Dexed windows + 1 melodic OPLL
    -D TDSP_DIAGNOSTICS=0    ; DTCM headroom (the OPLL engine + a 3rd song buffer); matches _4voice
    ; Metronome = the MASTER TRANSPORT (@METRO play/stop; the click reuses the slot-1 test tone). The
    ; app's global Play/Stop bar drives @METRO, so WITHOUT this the master transport (and master stop)
    ; is a no-op. The plain nobt parent doesn't set it (only the drumvoice/voice2 envs do); a hetero
    ; build needs it explicitly. Slots: 0=melodic OPLL, 1=metronome/tone, 3=Dexed pool.
    -D TDSP_METRONOME=1
; lib/TDspYmfm (OPLL) auto-found by LDF from HeteroOpll.h's #include <AudioSynthYmfmOPLL.h> (TDSP_HETERO set).

; --- Local dev board: 2 Dexed + 2 melodic OPLL + TSF (sampled GM) DRUMS + AUDIO LOOP (Thread D) ---
; The full heterogeneous instrument: FOUR melodic Track peers — two Dexed pool voices (tracks 0/1,
; g_synthSink / g_synthSinkB) and TWO melodic OPLL voices (tracks 2/3, HeteroOpll.h, summed through a
; private sub-mixer into mix slot 0) — PLUS a resident sampled GM-drum TSF (TinySoundFont, ch10) on mix
; slot 2 and the bar-locked audio-loop recorder. Mix slots: 0=melodic OPLL sub-mix, 1=metronome/tone,
; 2=TSF drums, 3=Dexed pool; the audio loops sit on the separate final mixer (no outL/outR slot). This
; is the payoff of decoupling the pool voice count from the total: TDSP_POOL_VOICES=2 keeps the 8-engine
; Dexed pool on its proven 2-way split (2 voices) while TDSP_SYNTH_VOICES=4 counts all four tracks; the
; ~35 SYNTH_VOICES>=4 pool sites are gated !TDSP_HETERO so the 4-way @POOL partition path stays out.
; DRUMS ARE TSF (sampled), which loads a bank-128 kit off the SD into PSRAM at runtime — so the kit only
; SOUNDS on a board with PSRAM + /sf2/gm_tsf.sf2 (or a drum-only font) on the card; drumTsfBegin() idles
; gracefully (drumEngineOk()=0, app hides the kit) on a no-PSRAM board. Audio-loop buffers likewise come
; from PSRAM else OCRAM (LEAN_RAM), reporting caps.audioloop=0 when none is free. The two melodic OPLL
; chips are ~9 KB DTCM each; DTCM is tight with a resident TSF drum font, so DIAGNOSTICS is off.
;   pio run -e teensy41_dexed2_opll2_drums
[env:teensy41_dexed2_opll2_drums]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=2
    -D TDSP_OPLL_ENGINES=2       ; two melodic OPLL voices (tracks 2/3), summed into mix slot 0
    -D TDSP_POOL_VOICES=2        ; the Dexed pool is 2 voices (proven 2-way split), NOT a 4-way pool
    -D TDSP_SYNTH_VOICES=4       ; 2 Dexed windows + 2 melodic OPLL = 4 melodic tracks total
    -D TDSP_DIAGNOSTICS=0        ; DTCM headroom (two OPLL chips + a resident TSF drum font + song buffers)
    -D TDSP_DRUM_TSF=1           ; sampled GM-drum SoundFont on mix slot 2 (needs PSRAM + /sf2 font on SD)
    -D TDSP_AUDIOLOOP=1          ; bar-locked crossfaded audio loops (@AL*; PSRAM/OCRAM buffers, caps-gated)
    ; Metronome = the MASTER TRANSPORT (@METRO play/stop drives the conductor; the app's global
    ; Play/Stop bar needs it). Reuses the slot-1 test-tone oscillator. See teensy41_dexed2_opll1.
    -D TDSP_METRONOME=1
; lib/TDspYmfm (OPLL) auto-found by LDF from HeteroOpll.h; lib/TDspTsf from DrumTsf.h (TSF drums).

; --- PROOF: 2 Dexed + 1 OPLL + 1 PLAITS + OPLL rhythm DRUMS (generalized multi-engine inventory) --
; Phase 2b of planning/multi-engine-tracks/DESIGN.md: proves a THIRD engine kind — authentic Plaits,
; wired as a hetero track via HeteroPlaits.h — coexists with Dexed + OPLL, PLUS an OPLL rhythm drum
; voice. Track 3 is a Plaits pool addressed by the SAME @TRK<3>.* / @STATE tracks[].eng="plaits" surface
; (the ITrackEngine vtable). All 4 F32 out slots used: 3=Dexed, 0=OPLL, 2=Plaits, 1=drums (slot 1 is
; free because TDSP_METRONOME reroutes the click to the POST mixer, not out slot 1). SPDIF-in dropped
; for DTCM. Stepping stone to a true no-Dexed inventory (needs the per-track song state arrayed off 2/3).
;   pio run -e teensy41_dexed2_opll1_plaits1
[env:teensy41_dexed2_opll1_plaits1]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=2
    -D TDSP_OPLL_ENGINES=1       ; one melodic OPLL voice (track 2 -> mix slot 0)
    -D TDSP_HETERO_PLAITS=1      ; one melodic Plaits track (track 3 -> mix slot 2)
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=2            ; Plaits bus -> mix slot 2
    -D TDSP_HP_VOICES=2          ; Plaits pool = 2 voices (each ~20 KB DMAMEM; 3 busts the OCRAM malloc heap -> AudioMemory_F32 new[] fails -> DACCVIOL)
    -D TDSP_DRUM_VOICE=1         ; OPLL rhythm drum voice (ch10, ~9 KB, no PSRAM)
    -D TDSP_DRUM_SLOT=1          ; drums -> mix slot 1 (freed: metronome click goes to the POST mixer)
    -D TDSP_POOL_VOICES=2        ; Dexed pool = 2 voices (2-way split)
    -D TDSP_SYNTH_VOICES=4       ; 2 Dexed + 1 OPLL + 1 Plaits = 4 melodic tracks
    -D TDSP_NO_SPDIF_IN=1        ; free DTCM (the Plaits pool + OPLL want it) + free out slot 2
    -D TDSP_DIAGNOSTICS=0        ; DTCM headroom
    -D TDSP_METRONOME=1
; Relocate the whole Plaits engine (~140 KB) OUT of ITCM to FLASH (plaits_flashmem.ld) so 2 Dexed +
; 1 OPLL + 1 Plaits fit RAM1 on the no-PSRAM board (else RAM1 overflows ~58 KB). Flash is cached and
; a 128-sample block leaves ~2.67 ms slack, so running Plaits from flash costs little. Keep the common
; scripts (cores overlay / dexed bend-range / ld-compat) since we override extra_scripts here.
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py
    post:../../tools/fx_ld_compat.py
    ./plaits_flashmem.py
; lib/TDspYmfm (OPLL) + lib/TDspPlaits2 (Plaits) auto-found by LDF from HeteroOpll.h / HeteroPlaits.h.

; --- jay-mint: 1 Dexed + 1 OPLL + 1 Plaits + TSF DRUMS (resident Mars/GM kits), LINE OUT ---------
; A curated heterogeneous inventory: one Dexed, one melodic OPLL, one Plaits macro-osc track, and the
; sampled TSF drum engine on ch10. jaymint profile (LINE OUT + PSRAM, SN 7681380) so the drum font is
; RESIDENT in PSRAM (loads /sf2/drumkits.sf2 at boot; @DRUMKIT selects kits within it). BT forced OFF
; to free mix slot 0 for OPLL + reclaim DTCM. Slots: 3=Dexed, 0=OPLL, 1=Plaits, 2=TSF drums (metronome
; click reroutes to the POST mixer). Plaits relocated to FLASH (plaits_flashmem.ld) for RAM1 headroom.
; TDSP_DRUM_TSF_DB=12 lifts the quiet Mars SF2 samples (~-20 dBFS) to a healthy level. Flashed
; USB_SERIAL for teensy_loader_cli over SSH.  pio run -e teensy41_dexed1_opll1_plaits1_tsfdrums_jaymint
[env:teensy41_dexed1_opll1_plaits1_tsfdrums_jaymint]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D USB_SERIAL
    -D TDSP_HAS_ESP32_BT=0       ; BT off -> free mix slot 0 for the OPLL sub-mix (+ reclaim DTCM)
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=1       ; one Dexed track (mix slot 3)
    -D TDSP_POOL_VOICES=1        ; Dexed pool = 1 voice
    -D TDSP_OPLL_ENGINES=1       ; one melodic OPLL voice (track -> mix slot 0)
    -D TDSP_HETERO_PLAITS=1      ; one melodic Plaits track (track -> mix slot 1)
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=1            ; Plaits bus -> mix slot 1 (TSF drums own slot 2 -> keep them apart)
    -D TDSP_HP_VOICES=1          ; Plaits pool = 1 voice (mono macro-osc; ~20 KB DMAMEM)
    -D TDSP_DRUM_TSF=1           ; sampled GM/Mars drums resident in PSRAM (loads /sf2/drumkits.sf2)
    -D TDSP_DRUM_SLOT=2          ; drums -> mix slot 2 (DrumTsf hard-wires slot 2; keep consistent)
    -D TDSP_DRUM_TSF_DB=12       ; boost quiet Mars SF2 samples (~-20 dBFS) to an audible level
    -D TDSP_SYNTH_VOICES=3       ; 1 Dexed + 1 OPLL + 1 Plaits = 3 melodic tracks
    -D TDSP_DIAGNOSTICS=0        ; DTCM headroom
    -D TDSP_METRONOME=1
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py
    post:../../tools/fx_ld_compat.py
    ./plaits_flashmem.py
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git
; lib/TDspYmfm (OPLL), lib/TDspPlaits2 (Plaits), lib/TDspTsf (drums) auto-found by LDF.

; --- Local dev board: 2 Dexed + 2 OPLL + TSF drums + SPRING REVERB (no-PSRAM) --------------------
; teensy41_dexed2_opll2_drums PLUS the hexefx SPRING reverb (lib/TDspHexeFx) as a master insert
; between the mix sum and the DAC (@FX / @FX.<PARAM>; caps.fx shows the app's Reverb card). SPRING
; (not PLATE) because it mallocs only ~37 KB from OCRAM (COST.md) — PLATE's ~190 KB busts OCRAM on a
; no-PSRAM board and crash-loops (DACCVIOL); plate reverb is the jaymint(PSRAM) env below. The audio
; loop is DROPPED here: it already can't allocate its OCRAM buffers on this no-PSRAM board (reported
; caps.audioloop=0 / greyed), and the spring reverb wants that same OCRAM — same tradeoff the
; teensy41_opll_fx env makes. The 2 Dexed + 2 OPLL voices are unchanged; TSF drums still grey out
; (no PSRAM for the font).  pio run -e teensy41_dexed2_opll2_drums_fx
[env:teensy41_dexed2_opll2_drums_fx]
extends = env:teensy41_dexed2_opll2_drums
build_unflags = ${common.build_unflags}
    -D TDSP_AUDIOLOOP=1          ; free OCRAM for the spring reverb (audio loop is non-functional here anyway)
build_flags = ${env:teensy41_dexed2_opll2_drums.build_flags}
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1
    -D TDSP_FX_SEND=1           ; per-voice aux SEND matrix (reverb = send bus, not master insert)
; lib/TDspHexeFx auto-found by LDF from effect_springreverb_F32.h (TDSP_FX_SPRING set).

; --- Local dev board (COM4, SN 18402920, no-PSRAM): 2 Dexed + 2 melodic OPLL + OPLL RHYTHM DRUMS
; + SPRING reverb + 24-bit USB AUDIO interface ------------------------------------------------------
; The local-board flash target. Starts from ..._drums_fx but swaps the TSF sampled drums (PSRAM-only,
; so SILENT on this no-PSRAM board) for the OPLL rhythm DRUM VOICE (src/DrumVoice.h, ~9 KB, no PSRAM)
; so the drums actually sound — three OPLL chips total (2 melodic + 1 rhythm) alongside the 2 Dexed
; voices. It also turns the box into a class-compliant 24-bit / 48 kHz USB sound card:
;   * USB descriptor swapped MTP -> USB_MIDI_AUDIO_SERIAL (adds native USB-device MIDI as a bonus);
;     -D AUDIO_SUBSLOT_SIZE=3 arms the F32 24-bit path (lib/USB_Audio_F32_24 + the overlaid Q31 rings).
;   * TDSP_USB_AUDIO auto-enables the external-input sub-mixer (extL/extR): USB in (+ optical/BT on
;     boards that populate them) sum DRY into the master-out mixer, BYPASSING the spring reverb. The
;     host also records the instrument mix (usbOut), tapped before the external sum so it isn't echoed.
; MTP is dropped (the SD no longer mounts on the host) — push SD assets over @WB instead
; (tools/push_file_serial.ps1).  pio run -e teensy41_dexed2_opll2_drumvoice_fx_usbaudio
[env:teensy41_dexed2_opll2_drumvoice_fx_usbaudio]
extends = env:teensy41_dexed2_opll2_drums_fx
build_unflags = ${env:teensy41_dexed2_opll2_drums_fx.build_unflags}
    -D TDSP_DRUM_TSF=1        ; drop sampled TSF drums (need PSRAM) in favour of the OPLL drum voice
    -D USB_DUAL_SERIAL     ; MTP can't coexist with USB Audio in one descriptor — drop it (use @WB)
build_flags = ${env:teensy41_dexed2_opll2_drums_fx.build_flags}
    -D TDSP_DRUM_VOICE=1      ; OPLL 5-sound rhythm drums on mix slot 2 (no PSRAM needed)
    -D USB_MIDI_AUDIO_SERIAL  ; USB device = Serial (CDC) + native MIDI + Audio
    -D AUDIO_SUBSLOT_SIZE=3   ; 24-bit / 48 kHz F32 USB audio (arms lib/USB_Audio_F32_24 + Q31 rings)
    -D TDSP_USB_AUDIO=1       ; USB audio in/out + external-input sub-mixer (bypasses the reverb)
; lib/USB_Audio_F32_24 auto-found by LDF from AudioInputUSB_F32.h (TDSP_USB_AUDIO set).

; --- jay-mint (Linux host): 2 Dexed + 2 OPLL + TSF drums + audio loop, LINE OUT, USB_SERIAL ---
; The jay-mint flash-host build of teensy41_dexed2_opll2_drums: same heterogeneous instrument, but on
; the jaymint board profile (LINE OUT + PSRAM, SN 7681380) and flashed as plain USB_SERIAL so
; teensy_loader_cli works over SSH (the MTP-composite DTR handshake is dead on Linux — see
; tools/linux-flash-host.md §6). Because jaymint.h keeps the ESP32/BT ON and that A2DP branch owns mix
; slot 0 — exactly where the melodic-OPLL sub-mix lands — this build FORCES BT OFF (TDSP_HAS_ESP32_BT=0)
; to free slot 0 (and drop the ~87 KB BT resampler from DTCM). PSRAM is present here, so unlike the
; no-PSRAM local board the TSF drum kit AND the audio loops actually come up (caps.audioloop>0, drums
; sound) — this is where the PSRAM-gated features are validated, not greyed.  pio run -e teensy41_dexed2_opll2_drums_jaymint_serial
[env:teensy41_dexed2_opll2_drums_jaymint_serial]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D USB_SERIAL
    -D TDSP_HAS_ESP32_BT=0       ; BT off -> free mix slot 0 for the OPLL sub-mix (+ reclaim DTCM)
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=2
    -D TDSP_OPLL_ENGINES=2
    -D TDSP_POOL_VOICES=2
    -D TDSP_SYNTH_VOICES=4
    -D TDSP_DIAGNOSTICS=0
    -D TDSP_DRUM_TSF=1           ; sampled GM drums (PSRAM present here -> loads /sf2/gm_tsf.sf2)
    -D TDSP_AUDIOLOOP=1
    -D TDSP_METRONOME=1
; lib/TDspYmfm (OPLL) auto-found by LDF from HeteroOpll.h; lib/TDspTsf from DrumTsf.h (TSF drums).

; --- jay-mint: 2 Dexed + 2 OPLL + TSF drums + PLATE REVERB (PSRAM), LINE OUT, USB_SERIAL ---
; teensy41_dexed2_opll2_drums_jaymint_serial PLUS the hexefx PLATE reverb as a master insert
; (Phase 2 FX). TDSP_FX_PSRAM routes the reverb's ~190 KB of delay/allpass/pitch buffers into
; PSRAM (patched lib/TDspHexeFx/src/basic_{delay,allpass,pitch}.h) so it coexists with the pool
; + TSF font + audio loops — the no-PSRAM plate build crash-loops on OCRAM, which is why this is
; a jaymint(PSRAM)-only env. @FX / @FX.<PARAM> control it (SIZE/DAMP/DIFF/SHIMMER/FREEZE...),
; caps.fx shows the app's Reverb card. It inserts AFTER the audio-loop final mix, before the DAC.
;   pio run -e teensy41_dexed2_opll2_drums_fx_jaymint_serial
[env:teensy41_dexed2_opll2_drums_fx_jaymint_serial]
extends = env:teensy41_dexed2_opll2_drums_jaymint_serial
build_unflags = ${env:teensy41_dexed2_opll2_drums_jaymint_serial.build_unflags}
build_flags = ${env:teensy41_dexed2_opll2_drums_jaymint_serial.build_flags}
    -D TDSP_FX=1
    -D TDSP_FX_PLATE=1
    -D TDSP_FX_PSRAM=1
    -D TDSP_FX_SEND=1           ; per-voice aux SEND matrix (reverb = send bus, not master insert)

; --- jay-mint board-health TEST build: dexed2_opll2_drums + @BOARDTEST self-test ------------
; Same firmware as teensy41_dexed2_opll2_drums_jaymint_serial PLUS the @BOARDTEST self-test
; (src/BoardTest.inc.h) and the FULL @CAP capture buffer it needs (TDSP_CAP_FULL re-enables the
; 16 KB buffer the lean build stubs to 64 samples). @BOARDTEST plays every melodic track (2 Dexed
; + 2 OPLL) + the TSF drum kit and captures the output bus at bend 0/+24/-24 so tools/board_bend_test.py
; can FFT-verify a full 2-octave bend each way per engine. Flash this to bench-test, then reflash the
; plain env for normal use.  pio run -e teensy41_dexed2_opll2_drums_jaymint_serial_test
[env:teensy41_dexed2_opll2_drums_jaymint_serial_test]
extends = env:teensy41_dexed2_opll2_drums_jaymint_serial
build_unflags = ${env:teensy41_dexed2_opll2_drums_jaymint_serial.build_unflags}
build_flags = ${env:teensy41_dexed2_opll2_drums_jaymint_serial.build_flags}
    -D TDSP_BOARDTEST=1
    -D TDSP_CAP_FULL=1

; --- jay-mint (Linux host): dexed pool + OPLL drum voice, LINE OUT, USB_SERIAL ---
; The jay-mint config of teensy41_dexed_pool_drumvoice: dexed MPE pool + the OPLL rhythm
; drum voice (src/DrumVoice.h) on slot 2, pinned to boards/jaymint.h (LINE OUT) and built
; plain USB_SERIAL so the Linux flash host's serial TX works (@WB/@STATE/@CRC round-trip;
; the MTP composite's DTR handshake is dead on Linux — see teensy41_sf2_tsf_jaymint_serial).
; jaymint.h keeps ESP32 BT on, so RAM1 is tighter than the nobt build — if the stack margin
; is unsafe, add -D MAX_FILTER_SAMPLES=5121 (frees ~90 KB DTCM, modest BT-resampler quality).
;   pio run -e teensy41_dexed_pool_jaymint_drumvoice_serial
[env:teensy41_dexed_pool_jaymint_drumvoice_serial]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D TDSP_DRUM_VOICE=1
    -D USB_SERIAL
    -D TDSP_METRONOME=1   ; on-beat click (reuses test-tone slot 1); @METRO=0|1. PLAN §13
; lib/TDspYmfm (OPLL) auto-found by LDF from DrumVoice.h's #include <AudioSynthYmfmOPLL.h>.

; --- jay-mint (Linux host): dexed pool + OPLL drums + FlasherX OTA, USB_SERIAL ----
; teensy41_dexed_pool_jaymint_drumvoice_serial PLUS the build-flag-gated FlasherX OTA
; self-update (src/FlasherXUpdate.inc.h + lib/FlasherX). Adds the @FXUP control command:
; stream an Intel-hex over USB Serial and the Teensy self-flashes + reboots -- no HalfKay
; button, no reflash tool. Cost ~48 KB flash + ~28 KB RAM1 (mostly C-lib scanf/float from
; the hex parser; measured in projects/spike_flasherx). Everything else identical to the
; parent, so default (non-fx) builds are byte-for-byte unaffected.
;   pio run -e teensy41_dexed_pool_jaymint_drumvoice_serial_fx
[env:teensy41_dexed_pool_jaymint_drumvoice_serial_fx]
extends = env:teensy41_dexed_pool_jaymint_drumvoice_serial
build_flags = ${env:teensy41_dexed_pool_jaymint_drumvoice_serial.build_flags}
    -D TDSP_FLASHERX=1
; lib/FlasherX auto-found by LDF from FlasherXUpdate.inc.h's includes (TDSP_FLASHERX set).

; --- jay-mint (Linux host): dexed pool + OPLL drums + VOICES 2 + ARP 2, USB_SERIAL --
; The jay-mint config of teensy41_dexed_pool_nobt_voice2: the jaymint board profile (LINE
; OUT, ESP32/BT on) + USB_SERIAL for the Linux flash host, PLUS the Voices-2 split + arp-2.
; NOTE: the jay-mint board has hung/re-enumerated on Dexed-pool builds before (power
; contention); if unstable, that's the board, not this feature. pio run -e teensy41_dexed_pool_jaymint_voice2_serial
[env:teensy41_dexed_pool_jaymint_voice2_serial]
extends = env:teensy41_dexed_pool_jaymint_drumvoice_serial
build_flags = ${env:teensy41_dexed_pool_jaymint_drumvoice_serial.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1

; --- jay-mint: 2 Dexed synths + TSF (sampled GM) DRUMS, LINE OUT, USB_SERIAL ----
; Two Dexed MPE voices (the 4/4 pool split + arp 2) with a resident sampled GM-drum TSF on
; mix slot 2 (TDSP_DRUM_TSF, NOT the OPLL rhythm voice) — needs PSRAM (jay-mint) + a bank-128
; drum font on the SD (/sf2/gm_tsf.sf2 or /sf2/drumkits.sf2, see DrumTsf.h). Built plain
; USB_SERIAL for the Linux flash host; MAX_FILTER_SAMPLES trims the BT resampler for DTCM stack
; margin (Dexed pool + a resident TSF font is DTCM-heavy). pio run -e teensy41_dexed_pool_jaymint_voice2_tsfdrums_serial
[env:teensy41_dexed_pool_jaymint_voice2_tsfdrums_serial]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_DRUM_TSF=1
    -D USB_SERIAL
    -D TDSP_METRONOME=1
    -D MAX_FILTER_SAMPLES=5121

; --- jay-mint (Linux host): FOUR independent Dexed voices, LINE OUT, USB_SERIAL ---
; The jaymint-profiled build of teensy41_dexed_pool_4voice (LINE OUT + ESP32/BT on +
; USB_SERIAL for the flash host). Diagnostics off (DTCM budget — 4 voices' control objects).
; BT-on makes RAM1 tighter than the nobt 4voice; MAX_FILTER_SAMPLES trims the BT resampler
; filter to reclaim DTCM if it overflows. pio run -e teensy41_dexed_pool_jaymint_4voice_serial
[env:teensy41_dexed_pool_jaymint_4voice_serial]
extends = env:teensy41_dexed_pool_jaymint_voice2_serial
build_flags = ${env:teensy41_dexed_pool_jaymint_voice2_serial.build_flags}
    -D TDSP_SYNTH_VOICES=4
    -D TDSP_DIAGNOSTICS=0
    -D MAX_FILTER_SAMPLES=5121   ; trim the BT async resampler filter to fit RAM1 with 4 voices

; --- ymfm OPM backend (lib/TDspYmfm, BSD-3-Clause) --------------------------
; Same BT + S/PDIF + songs + app control, but the synth is the YM2151 emulation.
; lib_deps override drops synth_dexed (no GPL in this build); build_src_filter
; excludes DexedVoiceBank.cpp (Dexed-only; pulls synth_dexed.h).
[env:teensy41_ymfm]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_YMFM=1
    ; Audition build: the `common` base keeps S/PDIF-in, whose async resampler filter[] costs ~87 KB
    ; DTCM and overflows RAM1 by ~51 KB on EVERY Teensy 4.1 (DTCM is fixed, PSRAM doesn't help) — so
    ; the bare env can't be flashed. Drop it (same as teensy41_opll) to fit + add the metronome transport.
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Plaits (Mutable Instruments macro-oscillator) — authentic, MIT ----------
; The real Plaits DSP (lib/TDspPlaits2: plaits/ + stmlib subset, Emilie Gillet,
; MIT), a 4-voice MPE pool over the 16 synthesis models. Renders native 48 kHz.
; Proven first on projects/spike_midi_plaits. Mix-kit side is SynthBackendPlaits.h.
;   pio run -e teensy41_plaits
[env:teensy41_plaits]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_PLAITS=1
    ; Audition build: drop S/PDIF-in (~87 KB DTCM) so it fits RAM1 on any T4.1 (see teensy41_ymfm note).
    ; Standalone Plaits fits with just this flag (the flashmem reloc below trims ITCM further); the reloc
    ; is only strictly required in the crowded dexed2_opll1_plaits1 multi-engine build.
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>
; plaits_flashmem.py relocates libTDspPlaits2.a code to FLASH (out of ITCM) so
; the 16-engine Plaits fits alongside the BT + S/PDIF resamplers in RAM1.
extra_scripts =
    ../../tools/cores_overlay.py
    ./plaits_flashmem.py

; --- Plaits SOLO + extras: authentic Plaits as the PRIMARY synth (16 models, 4-voice MPE pool on
; mix slot 3) PLUS the OPLL rhythm drum voice (ch10 -> slot 2, free via NO_SPDIF_IN), the beat-aware
; MIDI looper, and the spring reverb (master insert). No Dexed pool / no OPLL melodic track, so RAM is
; roomy on the no-PSRAM board — this is the isolation build to confirm Plaits SOUNDS on local hardware
; before chasing the multi-engine mix. Boots normal MIDI (NOT DEFAULT_MPE) so the on-screen keyboard +
; songs (ch 1) play — Plaits2Sink ignores the MPE master channel, so MPE-on-boot would mute it.
;   pio run -e teensy41_plaits_drumvoice_fx_loop
[env:teensy41_plaits_drumvoice_fx_loop]
extends = env:teensy41_plaits
build_flags = ${env:teensy41_plaits.build_flags}
    -D TDSP_DRUM_VOICE=1         ; OPLL rhythm drums on ch10 (~9 KB, no PSRAM)
    -D TDSP_DRUM_SLOT=2          ; drums -> mix slot 2 (free: SPDIF-in dropped)
    -D TDSP_RECORDER=1           ; beat-aware MIDI loop recorder (@REC*/caps.rec)
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1          ; spring reverb (OCRAM-light), master insert
extra_scripts =
    ../../tools/cores_overlay.py
    ./plaits_flashmem.py
    post:../../tools/fx_ld_compat.py

; --- Rings (DaisySP modal/string resonator) — MIT ---------------------------
; Mutable-Rings-style physical-modelling resonator (DaisySP ModalVoice +
; StringVoice, lib/TDspRings). 2 voices (the 24-mode modal resonator is ~32%
; CPU/voice; idle-gated). Proven first on projects/spike_midi_rings. Mix-kit
; side is SynthBackendRings.h.  pio run -e teensy41_rings
[env:teensy41_rings]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_RINGS=1
    ; Audition build: drop S/PDIF-in (~87 KB DTCM) so it fits RAM1 on any T4.1 (see teensy41_ymfm note).
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Virtual Analog (DaisySP: osc -> ladder -> ADSR) — MIT -------------------
; Subtractive VA synth, 8-voice, 5 presets, full 3-axis MPE. Built from DaisySP
; band-limited oscillators + Moog ladder filter (NOT ElectroTechnique's GPL
; TSynth). lib/TDspDaisyVa. Proven first on projects/spike_midi_va.
;   pio run -e teensy41_va
[env:teensy41_va]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_VA=1
    ; Audition build: drop S/PDIF-in (~87 KB DTCM) so it fits RAM1 on any T4.1 (see teensy41_ymfm note).
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPL3 (YMF262) + DMXOPL General-MIDI backend (BSD/CC-BY-SA) --------------
; The right engine for GM MIDI songs: 18-channel multitimbral + a full GM bank
; with drums. PENDING the OPL3 engine in lib/TDspYmfm — see
; lib/TDspYmfm/OPL3_DMXOPL_SPEC.md. The mix-kit side (SynthBackendOpl3.h /
; Opl3Sink.h / main.cpp branch) is already wired; UNCOMMENT this env once
; AudioSynthYmfmOPL3 exists, then `pio run -e teensy41_opl3`.
[env:teensy41_opl3]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPL3=1
    ; Audition build: drop S/PDIF-in (~87 KB DTCM) so it fits RAM1 on any T4.1 (see teensy41_ymfm note).
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPLL (YM2413) — the PSS-140 chip (BSD, ymfm) ---------------------------
; Yamaha YM2413 OPLL: 9-channel 2-op FM, 15 built-in ROM instruments + a 5-piece
; rhythm section. The literal chip in the Yamaha PSS-140. Self-contained GM: songs
; map per-channel program -> one of 15 timbres, drums on ch10. Engine lives in
; lib/TDspYmfm (AudioSynthYmfmOPLL); mix-kit side is SynthBackendOpll.h/OpllSink.h.
;   pio run -e teensy41_opll
[env:teensy41_opll]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL=1
    ; Drop optical S/PDIF IN (its async resampler filter[] costs ~87 KB DTCM). The
    ; `common` base leaves it on, which pushes even the tiny OPLL engine ~30 KB over
    ; RAM1; without it OPLL fits with ample headroom. Optical OUT self-test tone and
    ; Bluetooth A2DP IN are unaffected. This makes OPLL the "fits anywhere" GM test env.
    -D TDSP_NO_SPDIF_IN=1
    ; Metronome click (reuses the test-tone oscillator, mix slot 1; @METRO=0|1). See
    ; planning/tick-sync-playback/PLAN.md §13. Opt-in per env; slot-free so cheap here.
    -D TDSP_METRONOME=1
    ; MIDI loop recorder (voice 1 only here — voice 2 needs the split pool). Keeps this
    ; the "fits anywhere" green-build check for the recorder. See project_midi_loop_recorder.
    -D TDSP_RECORDER=1
    ; Audio loop recorder (lib/TDspAudioLoop): records the master mix into bar-locked,
    ; crossfaded audio loops. Buffers are runtime-allocated from PSRAM else OCRAM, so a
    ; board with no spare RAM just reports caps.audioloop=0. See planning/audio-looper/.
    -D TDSP_AUDIOLOOP=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- 0-DEXED mixed inventory PROOF: OPLL primary (track 0) + Plaits hetero (track 1), NO Dexed ------
; The first build with NO Dexed pool at all — proves the per-track-state arraying (bindTrackSongState)
; lets a hetero voice sit at any index. OPLL is the primary backend (g_synthSink), so track 0 is OPLL;
; TDSP_DEXED_VOICES=1 is just the index boundary (the primary occupies slot 0), NOT an actual Dexed pool
; (no TDSP_SYNTH_DEXED_POOL). Plaits appends at track 1. Relocates Plaits to flash to fit RAM1.
;   pio run -e teensy41_opll_plaits1
; --- 0-DEXED mixed inventory: OPL3 primary (GM, track 0) + Plaits hetero (track 1), NO Dexed --------
; "Add an OPL3 engine" as a mixed build: OPL3 (YMF262, 18-ch GM incl. its own ch10 drums) is the
; primary, Plaits appends at track 1. Same shape as teensy41_opll_plaits1 but OPL3-primary. OPL3's
; chip+resampler is heavier (~40 KB) so this is the RAM-tight one on no-PSRAM.  pio run -e teensy41_opl3_plaits1
[env:teensy41_opl3_plaits1]
extends = env:teensy41_opl3
build_flags = ${env:teensy41_opl3.build_flags}
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=1       ; index boundary only — the OPL3 PRIMARY occupies track 0 (no Dexed pool)
    -D TDSP_OPLL_ENGINES=0
    -D TDSP_HETERO_PLAITS=1
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=2
    -D TDSP_HP_VOICES=2
    -D TDSP_SYNTH_VOICES=2       ; OPL3(0) + Plaits(1) = 2 melodic tracks, NO Dexed
extra_scripts =
    ../../tools/cores_overlay.py
    ./plaits_flashmem.py
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

[env:teensy41_opll_plaits1]
extends = env:teensy41_opll
build_flags = ${env:teensy41_opll.build_flags}
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=1       ; index boundary only — the OPLL PRIMARY occupies track 0 (no Dexed pool)
    -D TDSP_OPLL_ENGINES=0       ; OPLL is the primary, not a hetero voice
    -D TDSP_HETERO_PLAITS=1
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=2            ; Plaits bus -> mix slot 2
    -D TDSP_HP_VOICES=2
    -D TDSP_SYNTH_VOICES=2       ; OPLL(0) + Plaits(1) = 2 melodic tracks, NO Dexed
extra_scripts =
    ../../tools/cores_overlay.py
    ./plaits_flashmem.py
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPLL + FX: hexefx SPRING reverb as a MASTER INSERT (Phase 2 of the FX plan) ---
; teensy41_opll + the hexefx stereo spring reverb (lib/TDspHexeFx) inserted between the master
; sum and the DAC. @FX / @FX.<PARAM> control it; caps.fx shows the app's Reverb card. SPRING
; (not PLATE) because it mallocs only ~37 KB from RAM2 (measured — COST.md) so it fits a NO-PSRAM
; board alongside the mix-kit's ~82 KB SD-song heap; PLATE's ~190 KB busts OCRAM here (crash-loops)
; — plate reverb lives in the PSRAM env below. Drops TDSP_AUDIOLOOP (also wants OCRAM). OPLL is the
; "fits anywhere" GM engine, so this is the FX green-build canary. Non-FX envs are unchanged.
;   pio run -e teensy41_opll_fx
[env:teensy41_opll_fx]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- OPLL + FX: hexefx PLATE reverb, buffers in PSRAM (PSRAM BOARDS ONLY) -----
; The rich plate reverb, but TDSP_FX_PSRAM forces its ~190 KB of delay/allpass/pitch buffers
; into PSRAM (patched lib/TDspHexeFx/src/basic_{delay,allpass,pitch}.h) instead of OCRAM — so it
; coexists with the mix-kit's OCRAM heap, unlike the no-PSRAM plate build which crash-loops.
; FLASH ONLY on a PSRAM board (jay-mint SN 7681380, or the future core): on a no-PSRAM board
; extmem_malloc returns NULL -> reverb begin() fails -> DACCVIOL. No-PSRAM boards use the SPRING
; env above. (@FX params: SIZE/DAMP/DIFF/SHIMMER/PITCH/FREEZE etc — the full plate surface.)
;   pio run -e teensy41_opll_fx_plate
[env:teensy41_opll_fx_plate]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL=1
    -D TDSP_NO_SPDIF_IN=1
    -D TDSP_METRONOME=1
    -D TDSP_FX=1
    -D TDSP_FX_PLATE=1
    -D TDSP_FX_PSRAM=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- jay-mint LINUX flash host: OPLL GM + loop loader, plain USB_SERIAL -------
; teensy41_opll flashed to the jay-mint board (SN 7681380) for testing the MIDI
; loop loader (@LOOPF / project_midi_loops). Same reasoning as
; teensy41_sf2_tsf_jaymint_serial: on jay-mint.local (Linux host) the Serial+MTP
; composite can't set dtr/rts, so the DTR-gated Serial never transmits — breaking
; @STATE readback and @WB pushes. This env drops MTP for plain USB_SERIAL (device
; 16c0:0483 "Teensyduino Serial", DTR works) and pins the jay-mint board profile
; (LINE OUT + unity startup). OPLL already sets TDSP_NO_SPDIF_IN so RAM1 fits with
; headroom. The MTP call sites are #ifdef USB_MTPDISK_SERIAL, so this compiles clean.
;   pio run -e teensy41_opll_jaymint_serial
[env:teensy41_opll_jaymint_serial]
extends = env:teensy41_opll
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_opll.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    -D USB_SERIAL
build_src_filter = ${env:teensy41_opll.build_src_filter}

; --- OPLL chip POOL — full 3-axis MPE (BSD, ymfm) ---------------------------
; A pool of N YM2413 chips (one note each) so the OPLL can do TRUE per-note MPE:
; bend + pressure + timbre (CC#74 -> per-note modulator brightness), the axis a
; single shared-user-voice chip can't do. 15 ROM + 100 PSS-140 voices, all loaded
; as modulatable user voices. Engine: lib/TDspYmfm/AudioSynthYmfmOPLLPool; mix-kit
; side: SynthBackendOpllPool.h / OpllPoolSink.h.  pio run -e teensy41_opll_pool
[env:teensy41_opll_pool]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_OPLL_POOL=1
    ; Drop the optical S/PDIF-in path (~85 KB RAM1): a melodic MPE performance build
    ; driven by a USB-host controller has no use for optical passthrough-in, and the
    ; 6-chip pool needs that DTCM back. Same choice as teensy41_opll_fx_plate.
    -D TDSP_NO_SPDIF_IN=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- jay-mint (Linux host): OPLL chip POOL — full 3-axis MPE, LINE OUT, USB_SERIAL ---
; The jay-mint flash-host build of teensy41_opll_pool: the 6-chip YM2413 pool (per-note
; bend + pressure + timbre) on the jaymint board profile (LINE OUT, SN 7681380), flashed as
; plain USB_SERIAL so teensy_loader_cli works over SSH (the MTP composite's DTR handshake is
; dead on Linux — see tools/linux-flash-host.md). BT forced off (TDSP_HAS_ESP32_BT=0): a
; USB-host MPE performance build needs no Bluetooth audio-in, and dropping the ~102 KB BT
; async-resampler frees DTCM.  pio run -e teensy41_opll_pool_jaymint_serial
[env:teensy41_opll_pool_jaymint_serial]
extends = env:teensy41_opll_pool
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_opll_pool.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    -D USB_SERIAL
    -D TDSP_HAS_ESP32_BT=0
    -D TDSP_LEAN_RAM=1
lib_deps =
build_src_filter = ${env:teensy41_opll_pool.build_src_filter}

; --- SF2 sampled General-MIDI backend (lib/TDspSF2 + sf22aswt, MIT) ----------
; Real sampled instruments (a "quality keyboard", not FM): a pool of
; AudioSynthWavetable voices driven by lib/TDspSF2's GM engine, loading SF2
; instruments off SD into PSRAM at runtime (adaptive to 8/16 MB). No GPL.
; Needs /sf2/gm.sf2 on the card. build_src_filter drops DexedVoiceBank.cpp
; (Dexed-only; pulls synth_dexed.h).
[env:teensy41_sf2]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_SF2=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- Full-fidelity SF2 GM via TinySoundFont (lib/TDspTsf, MIT) ---------------
; A COMPLETE SF2 renderer (velocity layers, region layering, all generators,
; filters, GM drums) — the full-featured alternative to teensy41_sf2's
; sf22aswt/AudioSynthWavetable engine. Whole font resident in PSRAM (samples as
; float), so it needs a COMPACT font at /sf2/gm_tsf.sf2 (GeneralUser's 30 MB
; won't fit). No GPL. Drops DexedVoiceBank.cpp (Dexed-only).
[env:teensy41_sf2_tsf]
extends = common
build_flags = ${common.build_flags}
    -D TDSP_SYNTH_SF2_TSF=1
lib_deps =
build_src_filter = +<*> -<DexedVoiceBank.cpp> -<DexedSdBank.cpp>

; --- jay-mint board: full-fidelity TSF GM (+ its own GM drums), LINE OUT ------
; The defined config for the jay-mint board (Teensy SN 7681380, 8 MB PSRAM): the
; TinySoundFont GM engine — which renders channel-10 drums itself, so this IS
; "TSF + TSF drums" — pinned to the jay-mint board profile (boards/jaymint.h:
; LINE OUT + unity startup). Needs /sf2/gm_tsf.sf2 on the SD card (TimGM6mb, from
; tools/sf2/fonts/gm_tim.sf2).  pio run -e teensy41_sf2_tsf_jaymint
[env:teensy41_sf2_tsf_jaymint]
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags}
    -D TDSP_BOARD_HEADER=\"boards/jaymint.h\"
    ; The whole-font-resident TSF engine + BT resampler overflow RAM1 (DTCM) by ~22 KB
    ; if optical S/PDIF-in is also linked (its async resampler filter[] ~87 KB DTCM).
    ; Drop S/PDIF-in to reclaim it; optical OUT self-test + Bluetooth IN are unaffected.
    -D TDSP_NO_SPDIF_IN=1
build_src_filter = ${env:teensy41_sf2_tsf.build_src_filter}

; --- jay-mint LINUX flash host: same TSF GM firmware but plain USB_SERIAL -----
; The Serial+MTP composite (USB_MTPDISK_SERIAL) is unusable when jay-mint.local
; (Linux) is the USB host: cdc_acm can't set dtr/rts on the composite, so the
; Teensy's DTR-gated Serial never asserts and TRANSMITS 0 bytes -- which breaks
; @WB acks (@WOK/@WE), the @CRC round-trip, and the esptool ESP32 bridge. This
; env drops MTP and builds plain USB_SERIAL (device enumerates 16c0:0483
; "Teensyduino Serial", DTR works). No host drag-and-drop to the SD, but @WB
; writes the card directly so that's irrelevant for a flash host. The 5 MTP call
; sites in main.cpp are #ifdef USB_MTPDISK_SERIAL so this compiles clean.
;   pio run -e teensy41_sf2_tsf_jaymint_serial
[env:teensy41_sf2_tsf_jaymint_serial]
extends = env:teensy41_sf2_tsf_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_sf2_tsf_jaymint.build_flags}
    -D USB_SERIAL
build_src_filter = ${env:teensy41_sf2_tsf_jaymint.build_src_filter}

; --- TSF font variants (A/B different SoundFonts) ----------------------------
; Same engine as teensy41_sf2_tsf; each picks a different RESIDENT font via a build
; flag (SynthBackendSF2Tsf.h). Copy the matching file from tools/sf2/fonts/ to the SD
; card at the path the flag names, then `pio run -e <env> -t upload`. The full
; size / PSRAM / quality matrix lives in tools/sf2/FONTS.md. No-flag base env above =
; TimGM6mb (/sf2/gm_tsf.sf2), the 8 MB-safe default.
[env:teensy41_sf2_tsf_gu12]        ; GeneralUser 12kHz  ~11.7MB  -> 16MB SAFE
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU12=1
[env:teensy41_sf2_tsf_gu14]        ; GeneralUser 14kHz  ~13.5MB  -> 16MB push
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU14=1
[env:teensy41_sf2_tsf_gu8]         ; GeneralUser  8kHz  ~8.0MB   -> 16MB, lo-fi
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU8=1
[env:teensy41_sf2_tsf_gu16]        ; GeneralUser 16kHz  ~15.4MB  -> 32MB+ (tight/over on 16)
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU16=1
[env:teensy41_sf2_tsf_gu18]        ; GeneralUser 18kHz  ~17.1MB  -> 32MB+
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU18=1
[env:teensy41_sf2_tsf_gu22]        ; GeneralUser 22kHz  ~20.8MB  -> 32MB+
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU22=1
[env:teensy41_sf2_tsf_gu24]        ; GeneralUser 24kHz  ~22.3MB  -> 32MB+
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU24=1
[env:teensy41_sf2_tsf_gufull]      ; GeneralUser native 44k ~30.6MB -> 64MB custom board
extends = env:teensy41_sf2_tsf
build_flags = ${env:teensy41_sf2_tsf.build_flags} -D TSF_FONT_GU_FULL=1

; ==================================================================================================
; --- "KITCHEN SINK" multi-engine: 2 Dexed + melodic OPLL + Plaits + OPLL rhythm drums + LOOPER +
;     REVERB, MPE-on-at-boot. Two board variants. -------------------------------------------------
; Built on the proven teensy41_dexed2_opll1_plaits1 hetero inventory (Dexed pool + 1 melodic OPLL +
; 1 Plaits track + an OPLL rhythm drum voice), then layered with the hexefx reverb + the bar-locked
; audio looper. TDSP_DEFAULT_MPE=1 boots straight into per-note MPE (songs use the picked instrument).
; MPE member bend range stays at the default 24 (TDSP_MPE_BEND_RANGE) so surface drags track 1:1 with
; a 24-semi controller — forcing 48 made the router scale bends ~2x and the drag overshot.
;
; LOCAL no-PSRAM board (COM4, SN 18402920): SPRING reverb (mallocs ~37 KB OCRAM — PLATE's ~190 KB
; busts OCRAM here). The audio looper is DROPPED (as in ..._drums_fx): its buffers need PSRAM/OCRAM
; that this board doesn't have to spare, and keeping it ON alongside the spring reverb makes the two
; contend for OCRAM at begin() — the failed malloc hangs the audio graph (froze on HW). The looper
; only functions on the PSRAM jay-mint variant below.
;   pio run -e teensy41_dexed2_opll1_plaits1_drumvoice_fx_loop
[env:teensy41_dexed2_opll1_plaits1_drumvoice_fx_loop]
extends = env:teensy41_dexed2_opll1_plaits1
build_flags = ${env:teensy41_dexed2_opll1_plaits1.build_flags}
    -D TDSP_RECORDER=1           ; beat-aware MIDI loop recorder per voice (lib/TDspMidiLoop; @REC*/caps.rec)
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1          ; spring reverb (OCRAM-light) — master insert
    -D TDSP_FX_SEND=1            ; per-synth/drum aux SEND matrix (each track has its own reverb send)
    -D TDSP_HP_VOICES=1          ; Plaits = 1 voice (mono): the 2-voice pool's ~40 KB DMAMEM + the spring
                                 ; reverb's OCRAM starved the F32 heap on this no-PSRAM board (DACCVIOL
                                 ; crash-loop). One voice frees ~20 KB -> stable (like the solo build).
    ; NOT TDSP_DEFAULT_MPE — the melodic Plaits track (Plaits2Sink) IGNORES notes on the MPE master
    ; channel (ch 1), which is what the on-screen keyboard + built-in songs send, so booting into MPE
    ; makes Plaits silent from the app. Boot normal MIDI (omni) so ch-1 input plays every engine; MPE is
    ; still available at runtime via the app's MIDI-mode toggle (@MIDIMODE=1) for a real MPE controller.

; LOCAL no-PSRAM board, NO PLAITS variant: 2 Dexed + 1 melodic OPLL + OPLL rhythm drums + spring
; reverb + MPE. Drops the Plaits track (its ~40 KB DMAMEM pool contends with the spring reverb's OCRAM
; on this no-PSRAM board — the suspected freeze) and frees a mix slot. Slots: 0=OPLL, 2=drums, 3=Dexed.
;   pio run -e teensy41_dexed2_opll1_drumvoice_fx_loop
[env:teensy41_dexed2_opll1_drumvoice_fx_loop]
extends = env:teensy41_dexed2_opll1
build_flags = ${env:teensy41_dexed2_opll1.build_flags}
    -D TDSP_DRUM_VOICE=1         ; OPLL rhythm drum voice on ch10 (~9 KB, no PSRAM)
    -D TDSP_DRUM_SLOT=2          ; drums -> mix slot 2 (free without Plaits)
    -D TDSP_RECORDER=1           ; beat-aware MIDI loop recorder (lib/TDspMidiLoop; @REC*/caps.rec) -> app's Loop Recorder card
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1          ; spring reverb (OCRAM-light)
    -D TDSP_FX_SEND=1            ; per-voice aux SEND matrix
    -D TDSP_DEFAULT_MPE=1        ; boot straight into MPE (bend range = default 24)

; --- Local dev board: 1 Dexed + 1 OPLL + 1 PLAITS + OPLL DRUMS + MIDI LOOPER + SPRING REVERB -------
; The full 3-engine-KIND hetero inventory on the no-PSRAM board: track 0 = Dexed (whole 8-engine pool,
; 1 window), track 1 = melodic OPLL (mix slot 0), track 2 = melodic Plaits (mix slot 2), + an OPLL
; rhythm drum voice on ch10 (mix slot 1), the beat-aware MIDI loop recorder, and the spring reverb as a
; master insert. This is the RAM-tightest build we run here: Plaits' ~140 KB is relocated OUT of ITCM to
; FLASH (plaits_flashmem.py) and SPDIF-in + DIAGNOSTICS are dropped for DTCM, but the recorder's per-
; voice loop clips (~8 KB each) AND the spring reverb's OCRAM buffers sit on top of Plaits' DMAMEM pool
; -- the exact contention that DACCVIOL-froze the earlier 2-Dexed/2-voice-Plaits build. So this trims to
; ONE Dexed window (POOL_VOICES=1) and ONE Plaits voice (HP_VOICES=1, ~20 KB DMAMEM) to buy the headroom.
; Mix slots: 0=OPLL, 1=OPLL drums, 2=Plaits, 3=Dexed pool; metronome click -> POST mixer; reverb = post
; master insert.  pio run -e teensy41_dexed1_opll1_plaits1_drumvoice_fx_loop
[env:teensy41_dexed1_opll1_plaits1_drumvoice_fx_loop]
extends = env:teensy41_dexed_pool_nobt
build_flags = ${env:teensy41_dexed_pool_nobt.build_flags}
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=1       ; ONE Dexed track window (uses the whole pool)
    -D TDSP_OPLL_ENGINES=1       ; one melodic OPLL voice (track 2 -> mix slot 0)
    -D TDSP_HETERO_PLAITS=1      ; one melodic Plaits track (track 3 -> mix slot 2)
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=2            ; Plaits bus -> mix slot 2
    -D TDSP_HP_VOICES=1          ; ONE Plaits voice (~20 KB DMAMEM) -> headroom for recorder + reverb
    -D TDSP_DRUM_VOICE=1         ; OPLL rhythm drum voice (ch10, ~9 KB, no PSRAM)
    -D TDSP_DRUM_SLOT=1          ; drums -> mix slot 1 (metronome click goes to the POST mixer)
    -D TDSP_POOL_VOICES=1        ; Dexed pool = 1 voice (whole 8-engine pool on one track)
    -D TDSP_SYNTH_VOICES=3       ; 1 Dexed + 1 OPLL + 1 Plaits = 3 melodic tracks (Plaits track NOT yet HW-verified)
    -D TDSP_NO_SPDIF_IN=1        ; free DTCM (Plaits pool + OPLL want it) + free out slot 2
    -D TDSP_DIAGNOSTICS=0        ; DTCM headroom
    -D TDSP_RECORDER=1           ; beat-aware MIDI loop recorder (lib/TDspMidiLoop; @REC*/caps.rec)
    -D TDSP_FX=1
    -D TDSP_FX_SPRING=1          ; spring reverb (OCRAM-light), master insert
    ; NOTE: NOT TDSP_DEFAULT_MPE — Plaits2Sink IGNORES notes on the MPE master channel (ch 1), and the
    ; on-screen keyboard + built-in songs all send ch 1, so booting into MPE makes the Plaits track
    ; silent. Boot in normal MIDI (master ch 0 = omni) so ch-1 input plays Plaits; MPE is still
    ; available at runtime via the app's MIDI-mode toggle (@MIDIMODE=1) for a real MPE controller.
    -D TDSP_METRONOME=1
; Plaits engine relocated to FLASH so 1 Dexed + 1 OPLL + 1 Plaits + recorder + reverb fit RAM1.
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py
    post:../../tools/fx_ld_compat.py
    ./plaits_flashmem.py

; JAY-MINT PSRAM board (SN 7681380, LINE OUT), flashed USB_SERIAL over SSH. PLATE reverb with its
; ~190 KB of buffers forced into PSRAM (TDSP_FX_PSRAM). Looper = the beat-aware MIDI loop recorder
; (TDSP_RECORDER, @REC*), NOT the audio looper. Drums are the sampled TSF SoundFont (bank-128 "…From
; Mars"/GM kits from /sf2/drumkits.sf2, resident in PSRAM) instead of the OPLL rhythm voice — this
; board has the PSRAM for it, so the OPLL is melodic-only here (one chip). BT forced off to free mix
; slot 0 for the OPLL sub-mix (+ reclaim DTCM). Slots: 3=Dexed, 0=OPLL, 1=Plaits, 2=TSF drums
; (metronome click reroutes to the POST mixer). Plaits relocated to FLASH.
;   pio run -e teensy41_dexed2_opll1_plaits1_tsfdrums_fx_loop_jaymint
[env:teensy41_dexed2_opll1_plaits1_tsfdrums_fx_loop_jaymint]
extends = env:teensy41_dexed_pool_jaymint
build_unflags = ${common.build_unflags}
    -D USB_DUAL_SERIAL
build_flags = ${env:teensy41_dexed_pool_jaymint.build_flags}
    -D USB_SERIAL
    -D TDSP_HAS_ESP32_BT=0       ; BT off -> free mix slot 0 for the OPLL sub-mix (+ reclaim DTCM)
    -D TDSP_VOICE2=1
    -D TDSP_ARP2=1
    -D TDSP_HETERO=1
    -D TDSP_DEXED_VOICES=2       ; two Dexed pool voices (mix slot 3)
    -D TDSP_POOL_VOICES=2        ; Dexed pool = 2 voices (2-way split)
    -D TDSP_OPLL_ENGINES=1       ; one melodic OPLL voice (track -> mix slot 0)
    -D TDSP_HETERO_PLAITS=1      ; one melodic Plaits track (track -> mix slot 1)
    -D TDSP_PLAITS_ENGINES=1
    -D TDSP_HP_SLOT=1            ; Plaits bus -> mix slot 1
    -D TDSP_HP_VOICES=2          ; Plaits pool = 2 voices (poly): PSRAM board, plate reverb in PSRAM frees OCRAM
    -D TDSP_DRUM_TSF=1           ; sampled TSF GM/Mars drums, resident in PSRAM (loads /sf2/drumkits.sf2)
    -D TDSP_DRUM_SLOT=2          ; drums -> mix slot 2 (DrumTsf hard-wires slot 2)
    -D TDSP_DRUM_TSF_DB=12       ; lift quiet Mars SF2 samples (~-20 dBFS) to an audible level
    -D TDSP_SYNTH_VOICES=4       ; 2 Dexed + 1 OPLL + 1 Plaits = 4 melodic tracks
    -D TDSP_NO_SPDIF_IN=1        ; free DTCM (the Plaits pool + OPLL want it) + free out slot 2
    -D TDSP_DIAGNOSTICS=0        ; DTCM headroom
    -D TDSP_METRONOME=1
    -D TDSP_RECORDER=1           ; beat-aware MIDI loop recorder (lib/TDspMidiLoop; @REC*/caps.rec). NOT the audio looper.
    -D TDSP_FX=1
    -D TDSP_FX_PLATE=1           ; rich plate reverb
    -D TDSP_FX_PSRAM=1           ; plate's ~190 KB buffers in PSRAM (PSRAM board only)
    -D TDSP_FX_SEND=1            ; per-voice aux SEND matrix
    ; NOT TDSP_DEFAULT_MPE — the melodic Plaits track (Plaits2Sink) IGNORES notes on the MPE master
    ; channel (ch 1), which the on-screen keyboard + built-in songs send, so booting into MPE silences
    ; Plaits from the app. Boot normal MIDI (omni); MPE stays a runtime toggle (@MIDIMODE=1) for a real
    ; MPE controller (member-channel bend range = default 24, matches a 24-semi controller).
extra_scripts =
    ../../tools/cores_overlay.py
    ../../tools/dexed_bend_range.py
    post:../../tools/fx_ld_compat.py
    ./plaits_flashmem.py
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git
; lib/TDspYmfm (OPLL), lib/TDspPlaits2 (Plaits), lib/TDspHexeFx (reverb) auto-found by LDF.

; --- Synth E: a SECOND independent melodic Plaits track (2 Dexed + OPLL + 2 Plaits = 5 voices) ------
; The two Plaits tracks (D + E) SUM through g_hpSubMix into the shared Plaits mix slot, since all four
; main mix slots are occupied (OPLL/Plaits/drums/Dexed). PSRAM board only (the extra pool + buffers).
;   pio run -e teensy41_dexed2_opll1_plaits2_tsfdrums_fx_loop_jaymint
[env:teensy41_dexed2_opll1_plaits2_tsfdrums_fx_loop_jaymint]
extends = env:teensy41_dexed2_opll1_plaits1_tsfdrums_fx_loop_jaymint
build_flags = ${env:teensy41_dexed2_opll1_plaits1_tsfdrums_fx_loop_jaymint.build_flags}
    -D TDSP_PLAITS_ENGINES=2     ; two melodic Plaits tracks (Synth D + Synth E); last -D wins over parent's =1
    -D TDSP_SYNTH_VOICES=5       ; 2 Dexed + 1 OPLL + 2 Plaits (overrides parent's =4)
    -D TDSP_HP_VOICES=1          ; 1 voice/track (mono) so 2 Plaits pools fit OCRAM (2 tracks x 2 voices overflowed the heap)
