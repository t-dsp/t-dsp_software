; t-dsp_spdif_monitor — optical S/PDIF input monitor.
;
; Stripped from t-dsp_f32_audio_shield: reuses that project's proven TAC5212
; typed-driver bring-up and the OpenAudio F32 TDM/SPDIF path, but drops ALL
; synths / sampler / arp / USB-host / mixer. The full firmware reboot-loops
; (the S/PDIF-in async resampler doesn't fit RAM1 alongside the synth fleet);
; with that load gone the resampler has ample headroom here.
;
; Signal path:
;   optical IN (pin 15) --AsyncAudioInputSPDIF3_F32-->  spdifIn
;        |-> AudioOutputSPDIF3_F32 -> optical OUT (pin 14)      [monitor/repeat]
;        \-> AudioOutputTDM_F32 slots 0/1 -> SAI1 -> TAC5212 DAC -> OUT1/OUT2
;            (OutMode::SeLine = single-ended line-level, plug into an amp)
;
; Build flags mirror the f32_audio_shield [env] verbatim so the OpenAudio /
; Teensy Audio libraries compile identically to the known-good build.

[platformio]
default_envs = teensy40_mux

[env]
platform = teensy
framework = arduino
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags =
    -D USB_MIDI_AUDIO_SERIAL
    -D AUDIO_SUBSLOT_SIZE=3
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    -D TDSP_RESAMPLER_FILTER_FAST_RAM
    -std=gnu++17
build_unflags = -std=gnu++14
monitor_speed = 115200
lib_extra_dirs = ../../lib
extra_scripts = ../../tools/cores_overlay.py

[env:teensy41_mux]
board = teensy41
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY41
    -D TDSP_HAS_I2C_MUX=1

[env:teensy41_nomux]
board = teensy41
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY41
    -D TDSP_HAS_I2C_MUX=0

[env:teensy40_mux]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1

[env:teensy40_nomux]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=0

; Self-test loop: emit a 1 kHz tone on optical OUT and play whatever returns on
; optical IN through the TAC5212 line out. Cable OUT->IN; the amp should play
; 1 kHz, proving tone->TX->cable->RX->TDM->DAC end to end.
[env:teensy40_selftest]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
    -D SELFTEST_TONE

; Same self-test loop, but codec driven by 2-ch I2S instead of 8-slot TDM, to
; test whether S/PDIF-RX coexists with I2S (it won't with TDM).
[env:teensy40_selftest_i2s]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
    -D SELFTEST_TONE
    -D I2S_OUT

; Simplest possible DAC test: 1 kHz tone -> TAC5212 DAC only, no S/PDIF compiled
; in at all. Isolates the codec DAC + F32 update path from everything else.
[env:teensy40_dactone]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
    -D DAC_TONE_ONLY

; Real use case: external optical source -> TAC5212 DAC line out. SPDIF IN + TDM,
; NO SPDIF out (tests if the hang was the SPDIF in+out combo, not in+TDM).
[env:teensy40_inonly]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
    -D SPDIF_IN_ONLY

; Isolation: 1 kHz tone straight to DAC line-out + optical OUT, bypassing the
; S/PDIF input. If the amp plays the tone, codec/output path is good and the
; async input is the only remaining problem.
[env:teensy40_directtone]
board = teensy40
build_flags = ${env.build_flags}
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
    -D DIRECT_TONE
