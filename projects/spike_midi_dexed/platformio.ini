; spike_midi_dexed — minimal bring-up for the physical MIDI-IN port + Dexed.
;
;   physical MIDI DIN/TRS --opto (H11L1)--> Teensy pin 0 (Serial1 RX, 31250) -->
;     Arduino MIDI Library --> AudioSynthDexed (6-op FM) -->
;     AudioOutputTDM (SAI1) --> TAC5212 DAC --> OUT1/OUT2 (HP jack).
;
; Deliberately strips the BT/S-PDIF mix graph so the ONLY variables while
; bringing up the MIDI port are: the port, the Dexed engine, and the codec.
; The TDspProgrammingKit is kept for touch-free Teensy flashing (U) + ESP32
; boot-out-of-the-way + LED heartbeat; drop it later if not needed.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary

; synth_dexed — 6-op FM (DX7) engine (GPL v3). Linking it makes the flashed
; binary GPL v3; the repo-side MIT source is unaffected. Fetched into the
; gitignored .pio/libdeps at build time.
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git
