; spike_spdif_min — minimal optical S/PDIF isolation test.
;
; Deliberately bare: stock Teensy Audio library only. No OpenAudio/F32, no
; vendored lib/ overlays, no USB-Audio/MIDI composite, no codec, no synth, no
; SD. USB type is the default plain Serial so the heartbeat is trivial to read.
;
; Purpose: the full t-dsp_f32_audio_shield firmware reboot-loops (board
; re-enumerates ~1x/sec, dies before printing). This sketch is too small to
; overflow RAM, so:
;   * steady LED blink + "alive up=Ns" heartbeat  -> firmware is fine; the loop
;     is caused by the big build (S/PDIF-in resampler / RAM fit).
;   * still reboot-loops here                      -> power/brownout or board HW.
;   * stable but optical TX stays dark             -> transmitter part/wiring.
;
; SPDIF OUT is on Teensy pin 14 (drives optical TT1). A 1 kHz tone is emitted
; continuously; any healthy transmitter glows red while this runs.

[platformio]
default_envs = teensy40

[env]
platform = teensy
framework = arduino
monitor_speed = 115200

[env:teensy40]
board = teensy40

[env:teensy41]
board = teensy41

; Loopback variants: also bring up the SPDIF receiver (pin 15) and meter it.
; Connect an optical cable from OUT (TT1) to IN (TR1).
[env:teensy40_loopback]
board = teensy40
build_flags = -D SPDIF_LOOPBACK

[env:teensy41_loopback]
board = teensy41
build_flags = -D SPDIF_LOOPBACK

; Repeater: SPDIF IN (pin 15) -> SPDIF OUT (pin 14). Feed an external optical
; source into IN; OUT mirrors it. RX level is metered in the heartbeat.
[env:teensy40_passthru]
board = teensy40
build_flags = -D SPDIF_PASSTHRU

[env:teensy41_passthru]
board = teensy41
build_flags = -D SPDIF_PASSTHRU
