; spike_midi_va — minimal bring-up for the physical MIDI-IN port driving a
; DaisySP virtual-analog synth (Electrosmith, MIT): 2 PolyBLEP oscillators ->
; Moog ladder filter -> ADSR. NOT ElectroTechnique's GPL TSynth code.
;
;   physical MIDI DIN/TRS --opto (H11L1)--> Teensy pin 0 (Serial1 RX, 31250) -->
;     Arduino MIDI Library --> DaisyVaSink --> N x AudioSynthDaisyVa -->
;     AudioMixer4 --> AudioOutputTDM (SAI1, int16) --> TAC5212 DAC --> HP jack.
;
; Same known-good codec/TDM/ESP32-kit plumbing as spike_midi_rings. MIT-clean.
; VA voices are cheap (osc+filter+ADSR), so more polyphony than Rings.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
