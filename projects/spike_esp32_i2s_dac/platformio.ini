; spike_esp32_i2s_dac — hear the ESP32 Bluetooth audio come out the TAC5212.
;
;   phone --A2DP/Bluetooth--> ESP32 (I2S MASTER, 44.1k)
;        --BCLK/LRCLK/DOUT--> Teensy SAI2 slave (AudioInputI2S2slave, data pin 5)
;        --> AudioOutputI2S (SAI1 master, 44.1k) --> TAC5212 DAC --> OUT1/OUT2.
;
; Stock int16 Audio runs natively at 44.1 kHz == the A2DP rate, so NO resampling
; is needed for this bring-up. The ESP32 and Teensy 44.1k crystals differ by a
; few ppm -> expect a slow, harmless drift (an occasional tiny glitch). Proper
; async resampling + integration into t-dsp_f32_audio_shield comes later.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind
; a TCA9544A I2C mux). Same codec bring-up as spike_spdif_alex_dac.

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
