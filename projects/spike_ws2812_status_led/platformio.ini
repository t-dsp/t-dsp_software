; T-DSP WS2812B Status LED Test — Teensy 4.1
; Drives the onboard status WS2812B on digital pin 31.
;
; HW path (from teensy41_digital_audio_board schematic, STATUS LED block):
;   Teensy pin 31 (symbol "31_CTX3") -> net TEENSY_LED
;     -> 74HCT2G17 dual buffer (3.3V -> 5V, non-inverting) -> WS2812B DIN
;
; The ESP32 can alternately drive the same LED via net ESP32_LED, so make sure
; the ESP32 firmware is not also toggling it while running this test.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

build_flags = -D USB_SERIAL

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

monitor_speed = 115200

; Shared libraries live at the repo root
lib_extra_dirs = ../../lib
