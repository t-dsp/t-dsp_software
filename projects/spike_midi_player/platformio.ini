; spike_midi_player — synth-agnostic MIDI file player.
;
;   built-in baked song + /songs/*.mid on SD + physical MIDI IN
;     --> tdsp::MidiFilePlayer (lib/TDspMidiPlayer, non-blocking)
;     --> tdsp::MidiSink  --> [ SYNTH BACKEND ]  --> AudioOutputTDM (SAI1)
;     --> TAC5212 DAC --> OUT1/OUT2 (HP jack).
;
; The player, the SMF parser, and the SD catalog talk ONLY to tdsp::MidiSink,
; so the synth engine is a build-time choice. Pick it with one flag:
;
;   default env (teensy41)        -> -D TDSP_SYNTH_DEXED  (AudioSynthDexed / DexedSink)
;   env teensy41_ymfm            -> -D TDSP_SYNTH_YMFM   (ymfm engine / YmfmSink)
;
; The ymfm env is scaffolded but intentionally does NOT build yet: main.cpp
; has a #error in the TDSP_SYNTH_YMFM branch until the ymfm port (separate
; spike) provides a YmfmSink (tdsp::MidiSink) + engine node to wire in. Build
; the default env for now.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).

[common]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
; synth_dexed — 6-op FM (DX7) engine (GPL v3). Linking it makes the flashed
; binary GPL v3; the repo-side MIT source is unaffected.
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git

; --- default: Dexed backend -------------------------------------------------
[env:teensy41]
extends = common
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    -D TDSP_SYNTH_DEXED=1

; --- ymfm OPM backend (BSD-3-Clause) ----------------------------------------
; Override lib_deps to empty so synth_dexed (GPL v3) from [common] is NOT
; linked here — a ymfm-only build carries no GPL obligation. AudioSynthYmfmOPM
; resolves via lib_extra_dirs (lib/TDspYmfm/library.json carries its includes).
[env:teensy41_ymfm]
extends = common
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    -D TDSP_SYNTH_YMFM=1
lib_deps =
; DexedVoiceBank.cpp is Dexed-only (pulls in synth_dexed.h); exclude it from the
; ymfm build so this env compiles with no synth_dexed dependency at all.
build_src_filter = +<*> -<DexedVoiceBank.cpp>
