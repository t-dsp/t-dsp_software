; spike_fx_plate_reverb — hexefx F32 FX cost/space bench.
;
; One env per effect: each instantiates EXACTLY ONE hexefx effect between an F32
; test tone and the TAC5212 (TDM), so the linker's --gc-sections strips every other
; effect and the size report reflects that one effect's real FLASH/RAM cost. Pair
; with `tools/fx_cost.py`, which builds every env, parses the size report, captures
; the runtime `[FXCOST]` CPU/RAM line over serial, and writes the cost table used to
; decide per-env FX slot budgets (see planning/plate-reverb-fx/DESIGN.md §6.5).
;
; Hardware: Teensy 4.1 + TAC5212 behind a TCA9544A I2C mux, SAI1 TDM (COM4 bench board).
; Flash one:  pio run -e fx_plate -t upload
; Hear it:    the tone runs at low level; wet is audible on reverb/delay/mod effects.

[common]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0   ; gcc 11 (C++17 cores)
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1                     ; TAC5212 behind the TCA9544A mux
    -D TDSP_DIGITAL_AUDIO_BOARD=1             ; DOUT bodge for this carrier board
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    -I ../../firmware/mix-kit/include          ; reuse tdsp_hw_config.h (mux + codec defaults)
build_unflags = -std=gnu++14
extra_scripts =
    ../../tools/cores_overlay.py               ; overlays T-DSP core + forces gcc-11
    post:../../tools/fx_ld_compat.py           ; drop --no-warn-rwx-segments for ld < 2.39 (jay-mint)
lib_extra_dirs = ../../lib                      ; OpenAudio, TAC5212, TDspHexeFx (all vendored)

; --- baseline: tone straight to DAC, no effect (the delta reference) ---------
[env:fx_none]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_NONE=1

; --- reverbs -----------------------------------------------------------------
[env:fx_plate]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_PLATE=1

[env:fx_spring]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_SPRING=1

; ReverbSC needs ~396 KB — PSRAM only. Expect this env to fail alloc / run silent on
; a no-PSRAM board; it's here to measure the cost, not to run on the bench board.
[env:fx_reverbsc]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_REVERBSC=1

; --- delay -------------------------------------------------------------------
[env:fx_delay]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_DELAY=1

; --- modulation --------------------------------------------------------------
[env:fx_phaser]
extends = common
build_flags = ${common.build_flags} -D SPIKE_FX_PHASER=1

; --- MORE EFFECTS (add as blocks in main.cpp, then an env here) ---------------
; The vendored headers are in lib/TDspHexeFx/src. Each is one #elif block in
; main.cpp (declare object, wire in/out, configure, un-bypass) + one env below:
;   fx_iphaser   effect_infphaser_F32.h        (mono 1->1)
;   fx_wah       effect_wahMono_F32.h           (mono, guitar)
;   fx_drive     effect_guitarBooster_F32.h
;   fx_eq3       filter_3bandeq.h               (stereo 3-band EQ)
;   fx_eqfir     filter_equalizer_F32.h         (mono FIR EQ)
;   fx_comp      effect_compressorStereo_F32.h
;   fx_gate      effect_noiseGateStereo_F32.h
;   fx_cab       filter_ir_cabsim_F32.h         (IR cabinet sim)
;   fx_tonestk   filter_tonestackStereo_F32.h
;   fx_widen     effect_monoToStereo_F32.h      (1->2)
