; spike_midi_ymfm_opm — minimal bring-up for the physical MIDI-IN port driving a
; Yamaha YM2151 (OPM) FM synth emulated with ymfm (Aaron Giles).
;
;   physical MIDI DIN/TRS --opto (H11L1)--> Teensy pin 0 (Serial1 RX, 31250) -->
;     Arduino MIDI Library --> AudioSynthYmfmOPM (ymfm ym2151, 8ch x 4-op FM) -->
;     AudioOutputTDM (SAI1, int16) --> TAC5212 DAC --> OUT1/OUT2 (HP jack).
;
; This is the OPM sibling of spike_midi_dexed: same known-good codec/TDM/ESP32-kit
; plumbing, with the synth swapped from Dexed (DX7, GPL v3) to ymfm's OPM (BSD-3).
; Deliberately ONLY ymfm here — no Dexed is compiled in, so the two FM engines can
; never contend, and this binary carries no GPL obligation (ymfm is BSD-3-Clause).
;
; The synth itself lives in lib/TDspYmfm (found via lib_extra_dirs), which vendors
; only the pure-FM ymfm core (no ADPCM/PCM/OPL/OPN), so there is no build-time
; network dependency and no external-ROM memory interface to wire up.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
; int16 TDM path — the F32 OpenAudio library isn't used here.
lib_ignore = OpenAudio_ArduinoLibrary
