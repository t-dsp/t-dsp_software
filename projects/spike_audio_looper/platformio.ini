; spike_audio_looper — compile/link + bench spike for lib/TDspAudioLoop.
;
; Proves tdsp::AudioLooper (the stereo audio loop recorder) builds against the
; real OpenAudio F32 framework and wires up in the anti-feedback topology from
; planning/audio-looper/DESIGN.md:
;
;   src (sine) ─┬─────────────► finalL/R slot0 (record bus) ─► I2S out
;               ├─► looper in L/R
;               └──────────────
;   looper out L/R ───────────► finalL/R slot1 (loop return)
;
; The looper records the record bus (NOT its own return -> no overdub feedback),
; loops it bar-locked to a free-running tdsp::Clock at 120 BPM.
; Serial keys: r=record  o=overdub  s=stop  c=clear.  48 kHz / block 128.
;
;   pio run -e teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; gcc 11 / C++17 toolchain (OpenAudio F32 + this lib use C++17), matching the
; production mix-kit + spike_f32_usb_loopback builds.
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0

build_flags =
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    -std=gnu++17
build_unflags = -std=gnu++14

monitor_speed = 115200
lib_extra_dirs = ../../lib
