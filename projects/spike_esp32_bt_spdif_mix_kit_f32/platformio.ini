; spike_esp32_bt_spdif_mix_kit_f32 — the F32 / 24-bit port of spike_esp32_bt_spdif_mix_kit.
;
; Same sources and routing as the int16 mix-kit, but the whole mix bus and the DAC
; output are now OpenAudio F32 (float32 in the graph, 32-bit TDM slots to the codec):
;
;   (A) phone --A2DP--> ESP32 (I2S master) --SAI2--> AsyncAudioInput<...I2S2_16bitslave>
;         (int16 resampler) --> AudioConvert_I16toF32   ---+
;   (B) tone --S/PDIF OUT--[optical loopback]--> AsyncAudioInputSPDIF3_F32 (F32-native) -+
;   (C) Dexed (int16 FM engine) --> AudioConvert_I16toF32                                -+
;   (D) local test tone: AudioSynthWaveformSine_F32                                      -+
;                                                                                        v
;                        AudioMixer4_F32 (outL/outR) --> AudioOutputTDM_F32 (SAI1, 32-bit
;                        slots) --> TAC5212 DAC (WordLen::Bits32) --> OUT1/OUT2.
;
; Why F32: the int16 mix-kit clipped on dense/low Dexed notes because AudioMixer4 (int16)
; hard-saturates at the sum, and Dexed's own float->q15 step saturates at +/-1.0. In F32 the
; mix bus has effectively unlimited internal headroom (no mid-graph clip) and the codec now
; takes a 24-bit-in-32-bit-slot word instead of 16-bit -- a wider "hose" into the DAC. The
; only residual clip point is the final F32->TDM conversion, at 24-bit resolution.
;
; ESP32 control (via lib/TDspProgrammingKit): r=reset->app  g=flash mode  @BOOTAPP@=exit
;   U=Teensy program mode.  Needs the pin37->ESP32-EN jumper (see the kit README).
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind a
; TCA9544A I2C mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    ; F32 / 48 kHz graph -- matches the proven F32 path (spike_f32_usb_loopback,
    ; t-dsp_f32_audio_shield). AudioOutputTDM_F32 masters SAI1 at this rate; the
    ; async resamplers retime the 44.1k A2DP / optical streams to it.
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_BLOCK_SAMPLES=128
    ; Size the resampler filter array. The upsampling path builds a polyphase
    ; filter of halfFilterLength(20) * overSampling(1024) + 1 = 20481 coeffs, so
    ; MAX_FILTER_SAMPLES must be >= 20481 or filter[] overruns (DACCVIOL). 20481
    ; keeps full 1024x oversampling while still freeing DTCM vs the default so the
    ; F32 blocks + Dexed + both resamplers fit.
    -D MAX_FILTER_SAMPLES=20481
    ; USB = Serial + MTP: the microSD appears on the host as a drag-and-drop
    ; device so songs can be added over USB (drop .mid into /songs, then Refresh
    ; in the app). Serial is kept for debug + the ESP32 flash bridge.
    -D USB_MTPDISK_SERIAL
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
; NOTE: unlike the int16 mix-kit, OpenAudio_ArduinoLibrary is NOT ignored here --
; the F32 mix bus, converts, and AudioOutputTDM_F32 all come from it.

; synth_dexed — 6-op FM (DX7) engine (GPL v3) for the Dexed source + MIDI IN.
; Linking it makes the flashed binary GPL v3; repo-side MIT source unaffected.
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git
