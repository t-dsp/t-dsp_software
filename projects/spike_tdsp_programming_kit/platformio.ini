; spike_tdsp_programming_kit — minimal demo/proof of lib/TDspProgrammingKit.
;
; Teensy 4.1 owns the on-board ESP32 (EN=pin37, IO0=pin36, UART0=Serial7 pins 28/29).
; Boots the ESP32 into its app and provides the touch-free flash loop:
;   g          -> ESP32 into ROM download + USB<->ESP32 passthrough (esptool --before no_reset)
;   @BOOTAPP@  -> soft-reboot out of flash mode; ESP32 back into its app (no power-cycle)
;   U          -> Teensy into HalfKay (program mode) for teensy_loader_cli -w (no button)
;   r          -> reset the ESP32 into its app
;
; No audio graph here, so the passthrough is completely unencumbered — the cleanest
; possible demonstration that the kit works as a drop-in. Needs a SOLID pin37->ESP32-EN
; connection (jumper on the current board).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
