; T-DSP I2C Scanner — Teensy 4.0 / 4.1
; Pulses the shared SHDNZ pin (pin 35) once at boot, then continuously scans
; the default Wire bus and reports every device that ACKs. Use it to confirm
; the TAC5212 (0x51) and on-board TLV320ADC6140 (0x4C) are wired and alive.
;
; Two boards are supported as separate environments — select at build/upload:
;   pio run -e teensy40 -t upload      (Teensy 4.0)
;   pio run -e teensy41 -t upload      (Teensy 4.1)
; With no -e, PlatformIO builds every env (teensy40 first).

; Shared settings inherited by every [env:*] below.
[env]
platform = teensy
framework = arduino
build_flags = -D USB_SERIAL     ; USB Serial for the scan report
monitor_speed = 115200
lib_extra_dirs = ../../lib      ; shared libraries live at the repo root

[env:teensy40]
board = teensy40

[env:teensy41]
board = teensy41
