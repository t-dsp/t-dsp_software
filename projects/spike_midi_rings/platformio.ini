; spike_midi_rings — minimal bring-up for the physical MIDI-IN port driving a
; Mutable-Rings-style modal/string resonator (DaisySP ModalVoice + StringVoice,
; Electrosmith, MIT).
;
;   physical MIDI DIN/TRS --opto (H11L1)--> Teensy pin 0 (Serial1 RX, 31250) -->
;     Arduino MIDI Library --> RingsSink --> N x AudioSynthRings (DaisySP modal/
;     string physical model) --> AudioMixer4 --> AudioOutputTDM (SAI1, int16) -->
;     TAC5212 DAC --> OUT1/OUT2 (HP jack).
;
; Same known-good codec/TDM/ESP32-kit plumbing as spike_midi_plaits; the only new
; moving part is the Rings engine (lib/TDspRings, found via lib_extra_dirs). MIT-clean.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
; int16 TDM path — the F32 OpenAudio library isn't used here.
lib_ignore = OpenAudio_ArduinoLibrary
