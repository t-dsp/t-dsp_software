; spike_spdif_alex — does alex6679's CURRENT async S/PDIF input coexist with an
; SAI (I2S) output on THIS Teensy 4.0 board?
;
; Our vendored lib/Audio async S/PDIF + Resampler were an OLD snapshot. They've
; now been replaced with alex6679's current teensy-4-spdifIn code (async input +
; Resampler + Quantizer + biquad). This is pure stock int16 Audio — no F32, no
; OpenAudio, no codec/mux — to test the ONE question cleanly:
;   * LED blinks  -> his current code + I2S/SAI coexist => the OLD code was the
;                    bug; port his fixes into our F32 path.
;   * LED dark    -> S/PDIF-RX + SAI hangs even with his current code => it's the
;                    Teensy 4.0 / board, not the software (forum question for alex).
;
; lib_ignore OpenAudio: its F32 async wrapper still calls the OLD Resampler API
; and would fail to compile against alex's new Resampler; we don't use it here.

[env:teensy40]
platform = teensy
framework = arduino
board = teensy40
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
