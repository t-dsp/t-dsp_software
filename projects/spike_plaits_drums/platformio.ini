; spike_plaits_drums — a NO-PSRAM synthesized drum kit built from the AUTHENTIC
; Mutable Instruments Plaits drum models (Emilie Gillet, MIT), as a candidate
; peer/replacement for the 5-sound OPLL rhythm voice.
;
;   MIDI IN (pin 0, ch10) / serial demo ─▶ GM drum map ─▶ voice pool ─┐
;                                           (note->model+pitch)         │  (AudioMixer4 x2)
;     voice[i] = AudioSynthPlaits set to engine 13/14/15               ├─▶ mix ─▶ TDM ─▶ TAC5212
;       13 Analog Bass Drum · 14 Analog Snare · 15 Hi-Hat              ┘        ─▶ HP out
;
; Plaits' three drum models are 808/909-modelled analog percussion. This spike
; maps the GM ch10 drum map onto them (kick/snare/toms via BD+SD retuned, hats/
; cymbals via HH with short/long decay) through a small polyphonic voice pool so
; overlapping hits don't cut each other. Goal: prove a richer-than-OPLL drum kit
; that needs NO PSRAM, and measure per-voice CPU + RAM for the mix-kit promotion.
;
; Same known-good codec/TDM/ESP32-kit plumbing as spike_midi_plaits; only the
; note->drum mapping is new. Plaits renders at the native 48 kHz (no resampling).
; MIT-clean (no Dexed/GPL compiled in).
;
; Bring-up path (serial):
;   * 'A' plays a demo beat (kick/snare/hat groove) — proves the kit sounds.
;   * '1'..'9' fire individual GM pieces (kick/snare/hats/tom/crash/...).
;   * play a ch10 groove into the DIN to hear real drum data.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + TAC5212 behind TCA9544A mux).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
; int16 TDM path — the F32 OpenAudio library isn't used here.
lib_ignore = OpenAudio_ArduinoLibrary
