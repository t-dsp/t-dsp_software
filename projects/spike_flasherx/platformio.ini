; spike_flasherx — Teensy 4.1 FlasherX footprint measurement.
;
; Two envs, identical firmware, differing only by whether FlasherX is linked and
; reachable. Compare the PlatformIO size report (RAM1/RAM2/FLASH) between them to
; get FlasherX's installed cost. FlasherX (lib/FlasherX) is picked up via
; lib_extra_dirs; the baseline env never #includes it, so the LDF leaves it out.
;
; Build both:   pio run -e teensy41_base -e teensy41_flasherx
; Flash w/ FX:  pio run -e teensy41_flasherx -t upload

[env]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
monitor_speed = 115200
lib_extra_dirs = ../../lib

[env:teensy41_base]
; FlasherX NOT compiled/linked — the baseline for the diff.

[env:teensy41_flasherx]
build_flags = ${env.build_flags} -D WITH_FLASHERX
