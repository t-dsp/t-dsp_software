; spike_spdif_alex_dac — the real goal, built on the proven spike_spdif_alex:
; alex6679's CURRENT async S/PDIF input + AudioOutputI2S feeding the TAC5212 DAC.
;
; Self-test loop: 1 kHz tone -> S/PDIF OUT (optical) -> [loopback cable] ->
; S/PDIF IN -> AudioOutputI2S -> SAI1 -> TAC5212 DAC -> OUT1/OUT2 (headphones/amp).
; If the amp plays the tone, the FULL optical-in -> analog-out chain works with
; alex's code. Pure stock int16 Audio (no F32/convert/OpenAudio); codec on I2S
; (2-ch) since a stereo monitor doesn't need the 8-slot TDM.

[env:teensy40]
platform = teensy
framework = arduino
board = teensy40
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_BOARD_TEENSY40
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
