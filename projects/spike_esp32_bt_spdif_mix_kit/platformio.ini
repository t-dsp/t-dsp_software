; spike_esp32_bt_spdif_mix_kit — spike_esp32_bt_spdif_mix, refactored onto the
; reusable lib/TDspProgrammingKit for all ESP32 boot/reset/flash control.
;
; Same audio: (A) phone --A2DP--> ESP32 (I2S master) --SAI2--> async resampler,
;             (B) tone --S/PDIF OUT--[optical loopback]--> S/PDIF IN --> async resampler,
;             mix --> AudioOutputTDM (SAI1) --> TAC5212 DAC --> OUT1/OUT2.
;
; The ESP32 side (boot+hold, g=flash, @BOOTAPP@=soft-reboot, U=Teensy program mode,
; r=reset, LED heartbeat) is now the drop-in kit instead of inline code. Audio is
; paused during flashing via kit.onFlashEnter(AudioNoInterrupts).
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind a
; TCA9544A I2C mux). Needs the pin37->ESP32-EN jumper (see the kit README).
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
    ; Size the resampler filter array. The upsampling path builds a polyphase
    ; filter of halfFilterLength(20) * overSampling(1024) + 1 = 20481 coeffs, so
    ; MAX_FILTER_SAMPLES must be >= 20481 or filter[] overruns (DACCVIOL). 20481
    ; keeps full 1024x oversampling (same quality as the 40961 default) while
    ; still freeing ~160KB of DTCM vs the default -> Dexed + both resamplers fit
    ; with ample stack. (Resampler.cpp also now clamps both branches as a guard.)
    -D MAX_FILTER_SAMPLES=20481
    ; USB = Serial + MTP: the microSD appears on the host as a drag-and-drop
    ; device so songs can be added over USB (drop .mid into /songs, then Refresh
    ; in the app). Serial is kept for debug + the ESP32 flash bridge.
    -D USB_MTPDISK_SERIAL
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary

; synth_dexed — 6-op FM (DX7) engine (GPL v3) for the Dexed source + MIDI IN.
; Linking it makes the flashed binary GPL v3; repo-side MIT source unaffected.
lib_deps =
    https://codeberg.org/dcoredump/synth_dexed.git
    ; MTP is built into the Teensy core (TD 1.60) — enabled by USB_MTPDISK_SERIAL,
    ; no external lib needed (adding one collides with the core's MTP_Teensy.h).
