; spike_esp32_bt_spdif_mix — mix TWO async sources into the TAC5212 DAC:
;
;   (A) Bluetooth: phone --A2DP--> ESP32 (I2S MASTER, 44.1k)
;         --BCLK/LRCLK/DOUT--> Teensy SAI2 slave (pin 5)
;         --> AsyncAudioInput<AsyncAudioInputI2S2_16bitslave> (resample ESP32 rate -> Teensy rate)
;   (B) S/PDIF self-test loop: tone --> S/PDIF OUT (pin 14 optical) --[loopback cable]-->
;         S/PDIF IN (pin 15) --> AsyncAudioInputSPDIF3 (resample S/PDIF rate -> Teensy rate)
;
;   both -> AudioMixer4 -> AudioOutputTDM (SAI1) -> TAC5212 DAC -> OUT1/OUT2.
;
; Two independent async resamplers run at once, each locking a foreign clock
; (the ESP32 crystal and the looped-back S/PDIF crystal) to the Teensy audio
; clock. AudioInputTDM (SAI1) is declared first and owns update-responsibility;
; the two async inputs and the S/PDIF output never claim it.
;
; Board: teensy41_digital_audio_board (Teensy 4.1 + ESP32-DevKitC + TAC5212 behind
; a TCA9544A I2C mux). Optical TOSLINK OUT (pin 14) -> IN (pin 15) loopback cable.

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@~1.110301.0
build_flags = -std=gnu++17
    -D TDSP_HAS_I2C_MUX=1
build_unflags = -std=gnu++14
extra_scripts = ../../tools/cores_overlay.py
lib_extra_dirs = ../../lib
lib_ignore = OpenAudio_ArduinoLibrary
