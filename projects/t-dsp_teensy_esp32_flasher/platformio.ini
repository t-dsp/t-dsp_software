[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DUSB_SERIAL
lib_extra_dirs = ../../lib     ; shared drivers live at the repo root (TDspEsp32)
; Upload happens over the Teensy's own USB (HalfKay); no COM port needed.
; Reliable flash on Windows:
;   pio run
;   <path>\tool-teensy\teensy_reboot.exe
;   <path>\tool-teensy\teensy_loader_cli.exe --mcu=TEENSY41 -w .pio\build\teensy41\firmware.hex
