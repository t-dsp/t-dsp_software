; spike_sd_xfer — test harness for the TDspSdXfer host->device SD write receiver.
;
; Boots the Teensy 4.1 as a plain USB-Serial device that speaks the '@'-command
; protocol, so a host tool (tools/push_file_serial.ps1) or a Web Serial page can
; push files straight onto BUILTIN_SDCARD with @WB, then verify them with @CRC —
; no MTP, no reflash. This proves Option C of planning/fast-sd-transfer/PLAN.md
; before it is folded into the mix-kit firmware.
;
; Commands (see src/main.cpp): @WB= (write), @CRC= (checksum), @LS= (list),
; @RM= (delete), @PING.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Plain USB Serial (CDC). Binary payloads stream over this at full speed.
build_flags = -D USB_SERIAL

monitor_speed = 115200

; Shared libraries (TDspSdXfer) live at the repo root.
lib_extra_dirs = ../../lib
