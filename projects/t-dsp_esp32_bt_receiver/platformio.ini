; T-DSP ESP32 Bluetooth Receiver
; ---------------------------------------------------------------------------
; Firmware for the ESP32-DevKitC on the teensy41_digital_audio_board.
; Role: Bluetooth Classic A2DP *sink* (audio receiver) PLUS a control front-end.
; A phone connects over A2DP; audio is decoded on the ESP32 and streamed out over
; I2S to the Teensy 4.1, which resamples 44.1k->48k and plays it through the
; TAC5212 DAC. A companion app commands the receiver -- enter pairing mode,
; disconnect, forget device, drive the Teensy's @-protocol -- and reads live status.
;
; The CONTROL TRANSPORT is selected at BUILD TIME; A2DP audio is in BOTH builds:
;   [env:esp32dev]      -D TDSP_CTRL_BLE   BLE GATT control (dual-mode BTDM). The
;                                          default/legacy build. See src/main.cpp
;                                          for the BLE contract (UUIDs/opcodes).
;   [env:esp32dev_wifi] -D TDSP_CTRL_WIFI  WiFi LAN WebSocket control (tdsp.local:81).
;                                          BLE is not compiled in (classic-only BT
;                                          frees the BLE controller RAM for WiFi).
; Never both -- src/main.cpp #errors if neither/both are defined. See README.md.
;
; This is the ONLY non-Teensy project in the repo: platform = espressif32.
;
; Audio path:
;   phone --A2DP/Bluetooth--> ESP32 (this firmware, I2S MASTER)
;                                   |
;                        I2S out (GPIO26 BCK / GPIO16 WS / GPIO25 DOUT)
;                                   v
;             #ESP32_I2S1 5-pin header --> Teensy SAI2 (slave input, pin 5 IN2)
;                                   v
;                     AudioInputI2S2slave_F32 --> resampler --> TAC5212 DAC
;
; The ESP32<->Teensy I2S pin map is fixed by the board (see README). The ESP32
; is I2S MASTER and generates BCLK/LRCLK; the Teensy is the I2S slave. This
; mirrors the proven JayShoe/esp32_T4_bt_music_receiver config.
;
; Flashing: USB (built-in CP2102 on the DevKitC) for now. A later phase lets
; the Teensy flash this firmware over UART2 + EN + IO0 (esptool protocol).

; Shared settings for every env. The envs below inherit via `extends = base` and
; add only their build_flags (and, for WiFi, one extra lib).
[base]
; Pin the 6.x platform line (arduino-esp32 2.0.x / ESP-IDF 4.4). This keeps the
; legacy i2s_config_t / i2s_pin_config_t API that the proven A2DP config uses;
; the 7.x line (arduino-esp32 3.x / IDF5) drops the legacy I2S driver. The WiFi
; env likewise relies on the legacy Arduino WiFi.h API on this line.
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Dual-mode Bluetooth (A2DP Classic + BLE control, BTDM) plus the BLE GATT stack
; pushes the image to ~1.17 MB -- 89% of the default 1.3 MB app partition, with
; no room to grow. huge_app.csv gives a single 3 MB app partition (no OTA, fine
; here since we flash over USB/bridge). NOTE: changing the partition layout moves
; the NVS offset, so the stored A2DP bond is lost on first flash -> re-pair once.
; The WiFi build trades BLE for the WiFi/lwIP/WebSocket stacks and also fits 3 MB.
board_build.partitions = huge_app.csv
; 115200 (not faster): this ESP32 is flashed *through the Teensy bridge*
; (projects/t-dsp_teensy_esp32_flasher), whose Serial7 is a fixed-rate 115200
; UART. esptool's higher-baud renegotiation can't cross the bridge and the link
; goes silent ("No serial data received"). Keep it at 115200 for the bridge path.
upload_speed = 115200

; pschatzmann's A2DP library (Bluetooth Classic sink/source for classic ESP32).
; Not in the PlatformIO registry under that name -> pull from GitHub directly.
; Required by BOTH envs: A2DP audio is always present regardless of transport.
lib_deps =
    ; Pinned: newer ESP32-A2DP fails to compile against the pinned espressif32/gcc-8.4
    ; (std::min error in BluetoothA2DPSink.cpp). b559fb15 is the last known-good build.
    https://github.com/pschatzmann/ESP32-A2DP.git#b559fb15bc01709e7f423adc362355a310eb7287

; Default/legacy build: A2DP audio + BLE GATT control on one radio (dual-mode BTDM).
[env:esp32dev]
extends = base
build_flags =
    -D TDSP_CTRL_BLE

; New: A2DP audio + WiFi LAN WebSocket control (no BLE).
; Set your bench network below -- credentials are build flags for now; runtime
; provisioning is a later phase. Quoting matters: '"..."' passes a C string literal
; through to the compiler. An unset SSID/PASS still builds but #warns and won't join.
[env:esp32dev_wifi]
extends = base
build_flags =
    -D TDSP_CTRL_WIFI
    ; A2DP is intentionally DROPPED in WiFi mode (official). Bluetooth Classic (A2DP)
    ; and WiFi share the one 2.4 GHz radio; the mandatory coexistence modem-sleep
    ; stalls the loop task and made the WS<->UART flash tunnel drop bytes under load
    ; (the Teensy RX never overran -- the loss was here, on the ESP). WiFi mode is
    ; control-only; WiFi audio is the forward path (see the audio-source-mux plan).
    ; With BT off, WiFi runs setSleep(false) at full speed -- which is what makes the
    ; over-WiFi Teensy flash (tools/fxflash_wifi.py + @FXUP/FlasherX) reliable.
    -D TDSP_A2DP=0
; WiFi credentials are SECRETS -- they live in a gitignored `.env` next to this file
; (copy .env.example), NOT here. load_env.py injects each KEY=VALUE as -DKEY="VALUE"
; at build time. No .env = still builds, but #warning + the ESP32 won't join a network.
extra_scripts = pre:../../tools/load_env.py
lib_deps =
    ${base.lib_deps}
    ; Markus Sattler's WebSocket server/client; compatible with arduino-esp32 2.0.x.
    ; Registry name is "WebSockets" (the GitHub repo is arduinoWebSockets).
    links2004/WebSockets@^2.4.1

; NOTE: the former [env:esp32dev_wifi_noa2dp] is gone -- esp32dev_wifi now IS
; A2DP-free (WiFi mode dropped Bluetooth audio, see above), so a separate no-A2DP
; env is redundant.
